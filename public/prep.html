<!doctype html>
<html lang="en">
<head>
<script src="turn.js"></script>
<script src="nav.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror app/globals.css (terminal green + amber accent) */
  :root {
    --bg: hsl(220 20% 4%);
    --card: hsl(220 18% 7%);
    --fg: hsl(140 60% 70%);
    --hi: hsl(140 30% 88%);
    --primary: hsl(140 70% 55%);
    --secondary: hsl(220 15% 11%);
    --muted: hsl(140 18% 42%);
    --accent: hsl(36 90% 55%);
    --danger: hsl(0 70% 55%);
    --border: hsl(140 30% 18%);
    --r-common: hsl(140 15% 58%);
    --r-rare: hsl(205 85% 62%);
    --r-epic: hsl(280 70% 70%);
    --r-legendary: hsl(36 90% 55%);
    /* Same tint the app uses for weapon/gadget PNGs (.operator-icon-primary) */
    --tint: brightness(0) saturate(100%) invert(65%) sepia(50%) saturate(500%) hue-rotate(92deg) brightness(.95);
  }
  /* Everything is in rem; the root scales with the screen */
  html { font-size: clamp(14px, min(var(--lh, 100dvh) / 26, var(--lw, 100vw) / 54), 21px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--fg); }
  body { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1rem; line-height: 1.2;
    -webkit-tap-highlight-color: transparent; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { -webkit-user-drag: none; user-select: none; }
  svg.i { width: 1em; height: 1em; fill: currentColor; flex: none; }
  .crt { pointer-events: none; position: fixed; inset: 0; z-index: 90;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 4px),
                radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.45) 100%); }

  @keyframes flash { 0% { box-shadow: 0 0 0 2px var(--accent), 0 0 1.6rem hsl(36 90% 55% / .8); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @keyframes bump { 0% { transform: scale(1.4); color: var(--hi); } 100% { transform: scale(1); } }
  .flash { animation: flash .9s ease-out; }
  .bump { animation: bump .45s ease-out; display: inline-block; }

  .app { height: var(--lh, 100dvh); max-width: 1600px; margin: 0 auto; display: grid; gap: .5rem;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    padding: max(.45rem, var(--sa-top, env(safe-area-inset-top))) max(.7rem, var(--sa-right, env(safe-area-inset-right))) max(.45rem, var(--sa-bottom, env(safe-area-inset-bottom))) max(.7rem, var(--sa-left, env(safe-area-inset-left))); }

  /* ---------- HUD ---------- */
  .hud { display: flex; align-items: center; gap: 1rem; min-width: 0; }
  .hud .grow { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: .35rem; height: 2.2rem; white-space: nowrap; font-weight: 700; }
  .chip small { font-size: .86rem; color: var(--muted); }
  .chip.gold { color: var(--accent); font-size: 1.3rem; }
  .chip.hp { color: var(--danger); letter-spacing: .05em; } .chip.hp .cost { color: var(--muted); margin-left: .4rem; }
  .chip.win { color: var(--primary); }
  .chip.streak { font-size: .86rem; letter-spacing: .08em; } .chip.streak.w { color: var(--primary); } .chip.streak.l { color: var(--danger); }
  .chip.gold .int { font-size: .86rem; color: var(--muted); font-weight: 400; margin-left: .15rem; }


  /* ---------- Trinkets ---------- */
  .trkChip { color: var(--accent); font-size: .9rem; letter-spacing: .1em; }
  .drop { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; background: hsl(220 18% 4% / .94); padding: 1rem; }
  .drop .box { width: min(44rem, 100%); display: grid; gap: .8rem; text-align: center; }
  .drop h2 { font-size: 1.3rem; letter-spacing: .2em; color: var(--accent); }
  .drop .sub { color: var(--muted); font-size: .86rem; }
  .tcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
  .tcard { border: 1px solid var(--tc); border-top-width: 3px; background: var(--card); border-radius: 2px; padding: .8rem .6rem; display: grid; gap: .45rem; justify-items: center; align-content: start; }
  .tcard:hover { box-shadow: 0 0 0 1px var(--tc), 0 0 1rem color-mix(in srgb, var(--tc) 40%, transparent); }
  .tcard .tb { border: 1px solid var(--tc); color: var(--tc); font-weight: 700; padding: .25rem .45rem; letter-spacing: .08em; }
  .tcard b { color: var(--hi); }
  .tcard span { color: var(--muted); font-size: .86rem; line-height: 1.3; }
  /* Starting draft: 5 commons, keep 3 */
  .tcards.draft { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6rem; }
  .dcard { padding: .7rem .4rem; gap: .35rem; }
  .dcard b { overflow-wrap: anywhere; }
  .dcard .rt { font-size: 1.6rem; font-weight: 700; color: var(--fg); }
  .dcard.on { border-color: var(--primary); background: hsl(140 70% 55% / .12); box-shadow: 0 0 0 1px var(--primary); }
  .dcard.on .rt { color: var(--primary); }
  #draftGo { justify-self: center; height: 2.8rem; padding: 0 2.4rem; background: var(--primary); color: var(--bg); font-weight: 700; letter-spacing: .2em; border-radius: 2px; }
  #draftGo:disabled { opacity: .35; cursor: default; }
  /* ---------- Mode select + rank ---------- */
  .chip.mode { font-size: .86rem; letter-spacing: .12em; color: var(--muted); }
  .modes { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; background: hsl(220 18% 4% / .95); padding: 1rem; }
  .modes .box { width: min(40rem, 100%); display: grid; gap: .8rem; text-align: center; }
  .modes .last { font-weight: 700; letter-spacing: .14em; color: var(--hi); }
  .modes .plus { color: var(--primary); } .modes .minus { color: var(--danger); }
  .rankRow { display: flex; align-items: center; justify-content: center; gap: .7rem; }
  .rhex { width: 2.6rem; height: 2.4rem; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: var(--rk);
    display: grid; place-items: center; color: var(--bg); font-weight: 700; }
  .rname { font-weight: 700; font-size: 1.4rem; color: var(--rk); letter-spacing: .12em; }
  .rbar { height: .4rem; width: min(22rem, 100%); margin: 0 auto; background: var(--secondary); border-radius: 1px; overflow: hidden; }
  .rbar i { display: block; height: 100%; background: var(--rk); }
  .rsub { color: var(--muted); font-size: .86rem; }
  .mbtns { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: .3rem; }
  .mbtn { border: 1px solid var(--border); background: var(--card); padding: .9rem .8rem; display: grid; gap: .4rem; text-align: left; border-radius: 2px; }
  .mbtn b { font-size: 1.2rem; letter-spacing: .2em; color: var(--primary); }
  .mbtn span { color: var(--muted); font-size: .86rem; line-height: 1.3; }
  .modes .credit { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .modes .credit a { color: inherit; }
  .mbtn.rk { border-color: var(--accent); } .mbtn.rk b { color: var(--accent); }
  .mbtn:hover { border-color: var(--primary); }
  .chip.rd { letter-spacing: .14em; color: var(--hi); font-size: .9rem; }
  .chip.rd small { font-size: .9rem; letter-spacing: .14em; color: var(--hi); }
  button.chip { padding: 0 .7rem; border: 1px solid var(--border); border-radius: 2px; color: var(--hi); letter-spacing: .14em; font-size: .9rem; }
  button.chip.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .mapChip .m { font-size: .86rem; letter-spacing: 0; }
  .up { color: var(--primary); } .down { color: var(--danger); }
  button.iconBtn { width: 2.2rem; padding: 0; justify-content: center; color: var(--muted); border: 0; }

  /* ---------- Stage: synergy rail + the team row over the blueprint ---------- */
  .stage { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: .6rem; min-height: 0; }
  .rail, .team { position: relative; }
  .rail { display: flex; flex-direction: column; align-items: center; gap: .35rem; min-height: 0; }
  .syns { flex: 1; min-height: 0; display: flex; flex-flow: column wrap; align-content: center; gap: .3rem; }
  .syn { width: 2.4rem; height: 2.1rem; flex: none; border: 1px solid var(--border); background: var(--secondary); border-radius: 2px; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
  .syn span { font-size: .86rem; line-height: 1; text-align: center; }
  .syn span b { display: block; font-size: .86rem; }
  .syn.on { color: var(--primary); border-color: var(--primary); background: hsl(140 70% 55% / .1); }
  .syn.max { color: var(--accent); border-color: var(--accent); background: hsl(36 90% 55% / .1); }
  .syn.sel { box-shadow: 0 0 0 1px var(--hi); }

  .team { container-type: size; display: flex; align-items: center; justify-content: center; gap: .9rem; min-height: 0; }
  .zg { --tw: min(calc((100cqw - var(--gapsW)) / var(--cols)), calc((100cqh - 5.6rem) * .76), 10rem);
    display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: .15rem; border-radius: 2px; }
  .zg .row { display: flex; gap: .45rem; }
  .zl { display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .1rem .4rem .2rem; }
  .zl .zn { font-size: .86rem; font-weight: 700; letter-spacing: .06em; color: var(--hi); white-space: nowrap; }
  .zl .zp { font-weight: 700; color: var(--primary); }
  .zl.sel { border-color: var(--accent); }
  .ghost .zl { visibility: hidden; }
  .ghost .pad { width: 2.3rem; height: calc(var(--tw) / .76); border: 1px dashed hsl(0 50% 35%); border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem;
    color: var(--danger); overflow: hidden; }
  .ghost .pad b { font-size: 1.1rem; }
  .ghost.open .zl { visibility: visible; } .ghost.open .pad { width: var(--tw); border-color: var(--border); color: var(--muted); } .ghost.open .pad b { font-size: 1.6rem; font-weight: 400; }
  .ghost .pad span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: .86rem; font-weight: 700; letter-spacing: .1em; white-space: nowrap; }
  .team.moving .zg { outline: 1px dashed var(--primary); outline-offset: 1px; background: hsl(140 70% 55% / .07); }

  /* ---------- Player tile: op portrait, name, power ---------- */
  .tile { --rc: var(--r-common); position: relative; width: var(--tw); height: calc(var(--tw) / .76); display: flex; flex-direction: column;
    background: hsl(220 15% 13% / .95); border: 1px solid var(--border); border-top: 3px solid var(--rc); border-radius: 2px; }
  .tile.sel { border-color: var(--accent); border-top-color: var(--rc); box-shadow: 0 0 0 1px var(--accent); }
  .tile .art { flex: 1; min-height: 0; display: grid; place-items: center; padding: 16% 16% 4%; }
  .tile .art .op, .tile .art .sil { width: 100%; height: 100%; }
  .tile .art .sil { fill: hsl(140 20% 18%); }
  .tile .plate { padding: .15rem .15rem .4rem; display: flex; justify-content: center; overflow: hidden; }
  .tcol { display: flex; flex-direction: column; align-items: center; gap: .2rem; }
  .tst { display: flex; flex-direction: column; align-items: center; gap: .05rem; font-size: 12px; line-height: 1.15; color: var(--muted); white-space: nowrap; }
  .tst > div { display: flex; gap: .45rem; }
  .tst span { display: inline-flex; align-items: center; gap: .12rem; } .tst b { color: var(--fg); font-weight: 600; }
  .tst svg { width: .62rem; height: .62rem; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .nm { display: inline-block; white-space: nowrap; font-weight: 700; font-size: 1rem; line-height: 1.15; color: var(--hi); transform-origin: center; }
  .tile .lvl { position: absolute; top: .3rem; right: .3rem; }
  .tile .star { position: absolute; top: .15rem; left: .3rem; color: var(--accent); font-size: .9rem; }
  .tile .buff { position: absolute; left: .2rem; bottom: 1.9rem; width: 1.5rem; height: 1.5rem; border: 1px solid var(--accent); background: var(--bg); display: grid; place-items: center; }
  .pop .mut { color: var(--muted); } .pop .warn { color: var(--accent); }
  .tile .buff.txt { width: auto; padding: 0 .25rem; } .tile .buff.txt b { font-size: .75rem; color: var(--accent); letter-spacing: .04em; }
  .tile .buff.wep { left: auto; right: .2rem; width: 2.4rem; }
  .tile .buff.wep img { filter: invert(.86); }
  .attx { font-size: 1.1rem; font-weight: 700; letter-spacing: .06em; color: var(--hi); border: 1px solid var(--border); padding: .2rem .35rem; border-radius: 2px; }
  .tile .buff img { width: 80%; height: 80%; object-fit: contain; filter: var(--tint); }
  .tile .buff em { position: absolute; right: -.55rem; top: -.55rem; font-style: normal; font-size: .75rem; font-weight: 700; color: var(--bg); background: var(--accent); border-radius: 2px; padding: 0 .15rem; line-height: 1.1; }
  .pow { position: absolute; left: 50%; bottom: -.7rem; transform: translateX(-50%); min-width: 2.6rem; padding: .05rem .35rem; text-align: center;
    font-weight: 700; color: var(--accent); background: var(--bg); border: 1px solid var(--accent); border-radius: 2px; }

  .op { display: block; color: var(--oc, var(--primary)); }
  .op svg { width: 100%; height: 100%; display: block; }
  .op svg path:not([fill]) { fill: hsl(140 35% 13%); }
  .pips { display: inline-flex; gap: .18rem; }
  .pips i { width: .45rem; height: .45rem; border: 1px solid var(--accent); display: block; transform: rotate(45deg); }
  .pips i.on { background: var(--accent); }

  /* ---------- Dock: bench + op slots ---------- */
  .dock { display: flex; align-items: center; justify-content: center; gap: 1.4rem; }
  .grp { display: flex; align-items: center; gap: .35rem; }
  .lbl { font-size: .86rem; letter-spacing: .16em; color: var(--muted); }
  .bslot { --rc: var(--r-common); overflow: hidden; width: 5.8rem; height: 2.5rem; display: flex; align-items: center; justify-content: center; padding: 0 .3rem;
    background: hsl(220 15% 13% / .95); border: 1px solid var(--border); border-left: 3px solid var(--rc); border-radius: 2px; }
  .bslot.empty { border: 1px dashed hsl(140 30% 12%); background: none; color: var(--primary); }
  .bslot.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .sock { position: relative; width: 2.6rem; height: 2.5rem; display: grid; place-items: center; background: var(--secondary); border: 1px solid var(--border); border-radius: 2px; }
  .sock .op { width: 1.8rem; height: 1.8rem; }
  .sock .pips { position: absolute; bottom: .15rem; left: 50%; transform: translateX(-50%); }
  .sock .pips i { width: .35rem; height: .35rem; }
  .sock.empty { border: 1px dashed hsl(140 30% 12%); background: none; }
  .sock.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .target { border-color: var(--primary) !important; border-style: dashed !important; }

  /* ---------- Bottom bar: Roll/Freeze · shop cards · READY ---------- */
  .shopbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .5rem; align-items: stretch; height: 8.2rem; grid-template-rows: minmax(0, 1fr); }
  .tools { display: flex; flex-direction: column; gap: .35rem; width: 4.2rem; }
  .tool { flex: 1; border: 1px solid var(--border); border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; font-size: .86rem; letter-spacing: .04em; line-height: 1.1; color: var(--muted); }
  .tool svg.i { font-size: 1.15rem; color: var(--fg); }
  .tool .cost { color: var(--accent); font-weight: 700; }
  .tool .free { color: var(--primary); font-weight: 700; }
  .tool.on { border-color: var(--r-rare); color: var(--r-rare); } .tool.on svg.i { color: var(--r-rare); }
  /* Two rows: players and items on top, ops below. Rating, icon or picture above the name */
  .shop { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: .3rem; min-height: 0; height: 100%; }
  .shop .card { gap: .1rem; padding: .15rem .3rem; border-top-width: 1px; border-left: 3px solid var(--rc, var(--border)); }
  .shop .card .art { flex: 1; width: 100%; padding-top: .2rem; }
  .shop .card .plate { flex: 0 0 auto; width: 100%; justify-content: center; }
  .shop .card .rtg { font-size: 1.25rem; }
  .card { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; padding: .3rem .25rem;
    border: 1px solid var(--border); border-top: 3px solid var(--rc, var(--border)); background: var(--secondary); border-radius: 2px; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); border-top-color: var(--rc, var(--accent)); }
  .card.frozen::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--r-rare); background: hsl(205 85% 62% / .06); pointer-events: none; }
  .card.sold { opacity: .12; pointer-events: none; }
  .card .art { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .card .art .op { height: 100%; max-height: 3rem; aspect-ratio: 1; }
  .card .art img { height: 100%; max-height: 2.6rem; max-width: 85%; object-fit: contain; filter: var(--tint); }
  .card .art.gunart img { max-height: 1.9rem; max-width: 92%; filter: invert(.86); }
  .card .rtg { font-size: 1.5rem; font-weight: 700; color: var(--rc); line-height: 1; }
  .card .plate { width: 100%; display: flex; justify-content: center; overflow: hidden; padding: 0 .1rem; }
  .card .nm { font-size: .9rem; }
  .price { position: absolute; top: .2rem; left: .3rem; color: var(--accent); font-weight: 700; font-size: .86rem; }
  .price::before { content: "¢"; }
  .badge { position: absolute; top: .2rem; right: .25rem; font-size: .86rem; color: var(--bg); background: var(--accent); padding: .1rem .25rem; font-weight: 700; }
  .ready.wait { opacity: .6; pointer-events: none; }
  .ready { width: 7rem; background: var(--primary); color: var(--bg); font-weight: 700; letter-spacing: .2em; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; }
  .ready b { font-size: 1rem; }
  .ready small { font-size: .86rem; letter-spacing: 0; opacity: .75; white-space: nowrap; }

  /* ---------- Inspect popover (details live here, not on the board) ---------- */
  .pop { position: fixed; z-index: 80; width: min(19rem, calc(var(--lw, 100vw) - 1rem)); background: hsl(220 18% 6%); border: 1px solid var(--accent); border-radius: 2px;
    padding: .55rem .65rem; box-shadow: 0 .6rem 2rem rgba(0,0,0,.7); display: grid; gap: .3rem; }
  .pop .h { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .pop .h b { color: var(--hi); font-size: 1.05rem; }
  .pop .tag { font-size: .86rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .pop .ln { font-size: .86rem; color: var(--muted); }
  .pop .ln b { color: var(--fg); font-weight: 500; }
  .pop .hint { font-size: .86rem; color: var(--accent); }
  .pop .tags { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; }
  .pop .tg { font: inherit; font-size: .86rem; color: var(--hi); border: 1px solid var(--border); border-radius: 2px; padding: .05rem .35rem; background: none; }
  .pop .tg.on { border-color: var(--accent); color: var(--accent); }
  .pop .tinfo { color: var(--hi); }
  .pop .acts { display: flex; gap: .4rem; justify-content: flex-end; margin-top: .15rem; }
  .pop.dock { grid-template-columns: minmax(0, 1fr) auto; align-content: center; gap: .15rem .8rem; padding: .4rem .65rem; }
  .pop.dock .h, .pop.dock .ln, .pop.dock .hint { grid-column: 1; }
  .pop.dock .acts { grid-column: 2; grid-row: 1 / 5; align-self: center; margin: 0; }
  .pop .gst { display: inline-flex; gap: .5rem; margin-left: .35rem; letter-spacing: 0; }
  .pop .gst span { display: inline-flex; align-items: center; gap: .15rem; } .pop .gst b { color: var(--fg); font-weight: 600; font-size: inherit; }
  .pop .gst svg { width: .75rem; height: .75rem; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .pop .ln b.up { color: var(--primary); } .pop .ln .down, .pop .ln b.down { color: var(--danger); }
  .btn { border: 1px solid var(--border); padding: 0 .7rem; height: 2.2rem; font-size: .86rem; letter-spacing: .12em; text-transform: uppercase; border-radius: 2px; }
  .btn.buy { border-color: var(--accent); background: var(--accent); color: var(--bg); font-weight: 700; }

  /* ---------- Declutter + guidance ---------- */

  @media (prefers-reduced-motion: reduce) { .card.owned::before { animation: none; background-position: 50% 0; } }

  /* ---------- Drag and drop ---------- */
  .tile, .bslot, .sock, .card { touch-action: none; }
  .ghostdrag { position: fixed; z-index: 85; pointer-events: none; margin: 0; opacity: .92; transform: rotate(-3deg) scale(1.05); box-shadow: 0 .8rem 2rem rgba(0,0,0,.7); }
  .dragsrc { opacity: .25; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  body.drag-player .zg, body.drag-shopplayer .zg { outline: 1px dashed hsl(140 70% 55% / .5); outline-offset: 1px; }
  body.drag-player .bslot.empty, body.drag-shopplayer .bslot.empty, body.drag-shopop .sock.empty { border-color: var(--primary); }
  body.drag-slot .team .tile, body.drag-shopop .team .tile, body.drag-shopitem .team .tile { box-shadow: 0 0 0 1px hsl(140 70% 55% / .6); }
  body.drag-player .sock, body.drag-player .sock.empty { border-color: hsl(140 70% 55% / .6); }
  .over { outline: 2px solid var(--accent) !important; outline-offset: 2px !important; background: hsl(36 90% 55% / .08) !important; }
  .shopbar { position: relative; }
  .sellzone { position: absolute; inset: 0; z-index: 5; display: none; place-items: center; border: 1px dashed var(--danger); background: hsl(0 60% 10% / .92); color: hsl(0 70% 75%); font-weight: 700; letter-spacing: .2em; }
  body.drag-player .sellzone, body.drag-slot .sellzone { display: grid; }
  .sellzone.over { outline: 2px solid var(--danger) !important; background: hsl(0 60% 14% / .95) !important; }

  /* ---------- Juice ---------- */
  .fly { position: fixed; z-index: 86; pointer-events: none; margin: 0; }
  .floater { position: fixed; z-index: 87; pointer-events: none; font-weight: 700; color: var(--accent); text-shadow: 0 0 .6rem hsl(36 90% 55% / .7); white-space: nowrap; transform: translate(-50%, 0); animation: floatUp 1.1s ease-out forwards; }
  .floater.good { color: var(--primary); text-shadow: 0 0 .6rem hsl(140 70% 55% / .7); }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, .4rem) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -2.2rem) scale(1); } }
  .lvlup { animation: lvlup 1.1s ease-out; }
  @keyframes lvlup { 0% { box-shadow: 0 0 0 3px var(--accent), 0 0 2.4rem hsl(36 90% 55% / .9); transform: scale(1.08); } 40% { transform: scale(1); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .lvlup .pips i.on { animation: pip .6s ease-out; }
  @keyframes pip { 0% { transform: rotate(45deg) scale(2.2); } 100% { transform: rotate(45deg) scale(1); } }
  .tick-up { color: var(--primary) !important; } .tick-down { color: var(--danger) !important; }

  /* Short screens (Safari with its toolbars showing): one shop row so the board keeps its room */
  @media (max-height: 360px) { .shopbar { height: 5.4rem; } .shop { grid-template-columns: repeat(9, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: .25rem; }
    .shop .card { padding: .15rem .15rem; } .shop .card .art { padding-top: .7rem; }
    .tools { gap: .2rem; } .tool { gap: 0; min-height: 0; overflow: hidden; } .tool svg.i { font-size: 1rem; } }
  @media (max-width: 760px) { .mapChip .mods { display: none; } .hud { gap: .7rem; } .dock { gap: .9rem; } }

  .rotate { display: none; position: fixed; inset: 0; place-items: center; text-align: center; padding: 1.5rem; }
  .rotate .ic { font-size: 3.4rem; color: var(--primary); display: inline-block; animation: tilt 2.4s ease-in-out infinite; }
  .rotate .t { font-weight: 700; letter-spacing: .25em; margin: 1rem 0 .4rem; color: var(--hi); }

  .rotate .btn { margin-top: 1.3rem; height: 2.8rem; border-color: var(--accent); color: var(--accent); }
  @keyframes tilt { 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) { html:not(.turned) .app, html:not(.turned) .pop { display: none !important; } html:not(.turned) .rotate { display: grid; } }
  /* Installed app: already fullscreen, so no fullscreen buttons */
  @media (display-mode: fullscreen), (display-mode: standalone) { #fsBtn, #rotateFs { display: none !important; } }
  .elsewhere { position: fixed; inset: 0; z-index: 999; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 94%, transparent); }
  .elsewhere > div { display: flex; flex-direction: column; align-items: center; gap: .7rem; text-align: center; }
  .elsewhere .btn { height: 2.6rem; padding: 0 1.2rem; border: 1px solid var(--primary); background: var(--primary); color: var(--bg); font-weight: 700; letter-spacing: .14em; cursor: pointer; }
  .elsewhere b { color: var(--accent); letter-spacing: .15em; font-size: 1.1rem; } .elsewhere span { color: var(--muted); }

<script>
// One run per account (the browser stands in for the account until there are logins).
// The page opened last owns the run; any other open page locks so two pages can't overwrite each other.
const PAGE_ID = Math.random().toString(36).slice(2);
let NOT_OWNER = false;
try { localStorage.setItem('battler.owner', PAGE_ID); } catch {}
addEventListener('storage', e => {
  if (e.key !== 'battler.owner' || e.newValue === PAGE_ID || NOT_OWNER) return;
  NOT_OWNER = true;
  if (typeof setPaused === 'function') setPaused(true);   // battle: freeze the fight
  const d = document.createElement('div');
  d.className = 'elsewhere';
  d.innerHTML = '<div><b>RUN OPEN ELSEWHERE</b><span>Your run is open in another tab or window.</span><button class="btn go">PLAY HERE</button></div>';
  d.querySelector('button').onclick = () => location.reload();
  document.body.appendChild(d);
});

/* ---------- Data (player-seasons from data/R6 Stats - Sheet1.csv) ---------- */
const SVG = {}; // inlined so the two-tone badge (dark plate + currentColor emblem) survives
const GADGET = f => `items/${f}`;
const REROLL_ICON = '<svg class="i" viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 7.4 5H22l-3.5 4L15 9h2.2A6 6 0 0 0 6 12H4a8 8 0 0 1 8-8zm-6.5 7L9 15H6.8A6 6 0 0 0 18 12h2a8 8 0 0 1-15.4 3H2z"/></svg>';
const SILHOUETTE = '<svg class="sil" viewBox="0 0 24 24"><path d="M12 2.5c3 0 5.2 2 5.2 5v1.3c0 2.9-2.3 5.2-5.2 5.2s-5.2-2.3-5.2-5.2V7.5c0-3 2.2-5 5.2-5zM4 21.5c.4-3.8 3.6-6.3 8-6.3s7.6 2.5 8 6.3z"/></svg>';

const EMPTY_WARN = { Entry:'No pressure on their Anchor', Anchor:'Their Entry walks in', Flank:'Their Roam is free', Roam:'Their Flank walks in', Support:'No lane boost' };
const PASSIVES = {
  // Text matches what sim.js does. Each player with a passive gets it; it doesn't need others on the team.
  'Clutch Gene': ['CG', 'Last one alive: +25% damage and more headshots.'],
  'Opener':      ['OP', '+25% fire rate until 2 players are down.'],
  'Headhunter':  ['HS', 'About 3x as many headshots.'],
  'Survivor':    ['SV', '+15 HP.'],
  'Closer':      ['CL', '+25% fire rate once 5 players are down, or in a clutch.'],
  'Winner':      ['WN', 'No effect in fights yet.'],
};

// Role passives: one per player from a shared pool per role, picked from their real stats. Same table as the battle.
const ROLE_MULT = { common: 1, rare: 1.33, epic: 1.67, legendary: 2 };
const pct = v => Math.round(v * 100) + '%';
const ROLE_PASSIVES = {
  aim:       { role: 'IGL',     name: 'Aim Discipline', team: true, v: 0.013,  info: v => `Team +${pct(v)} hit chance.` },
  reload:    { role: 'IGL',     name: 'Reload Drills',  team: true, v: 0.3,  info: v => `Team reloads ${pct(v)} faster.` },
  tempo:     { role: 'IGL',     name: 'Tempo',          team: true, v: .04,  ramp: true, info: v => `Team +${pct(v)} RPM per team kill.` },
  lurker:    { role: 'Roam',    name: 'Lurker',         v: 0.12,  ramp: true, info: v => `+${pct(v)} damage per second in a fight (max 5s).` },
  hunter:    { role: 'Roam',    name: 'Hunter',         v: 0.2,   ramp: true, info: v => `+${pct(v)} damage per team kill.` },
  ghost:     { role: 'Roam',    name: 'Ghost',          v: 0.08,  info: v => `${pct(v)} of shots at them miss.` },
  first:     { role: 'Entry',   name: 'First Contact',  v: 0.15,  info: v => `+${pct(v)} RPM for the first 2s.` },
  flash:     { role: 'Entry',   name: 'Flash Hands',    v: 0.1,  info: v => `Their first target misses ${pct(v)} more for 2s.` },
  space:     { role: 'Entry',   name: 'Space Maker',    v: 0.08,  info: v => `When they die, team +${pct(v)} hit on their killer.` },
  hold:      { role: 'Anchor',  name: 'Hold',           v: 6,    info: v => `+${Math.round(v)} armor until first hit.` },
  digin:     { role: 'Anchor',  name: 'Dig In',         v: 1.5,   ramp: true, info: v => `+${v.toFixed(1)} armor per second in a fight (max 8s).` },
  lastline:  { role: 'Anchor',  name: 'Last Line',      v: .1,   info: v => `+${pct(v)} damage while 3+ teammates are alive.` },
  medic:     { role: 'Support', name: 'Medic',          team: true, v: .3,  info: v => `Team heals +${pct(v)}.` },
  quarter:   { role: 'Support', name: 'Quartermaster',  team: true, v: 1,   info: v => `Team gadgets get +${Math.floor(v)} charge${Math.floor(v) > 1 ? 's' : ''}.` },
  ammo:      { role: 'Support', name: 'Ammo Runner',    team: true, v: 0.3, info: v => `Team magazines +${pct(v)}.` },
  crossfire: { role: 'Flank',   name: 'Crossfire',      v: 0.2,  info: v => `+${pct(v)} hit on enemies fighting someone else.` },
  pincer:    { role: 'Flank',   name: 'Pincer',         v: 0.18,  info: v => `+${pct(v)} damage while your Roam is alive.` },
  pressure:  { role: 'Flank',   name: 'Pressure',       v: .05,  ramp: true, info: v => `+${pct(v)} damage per burst fired (max 8).` },
  fill:      { role: 'Flex',    name: 'Fill',           v: .75,  info: v => `Copies a missing role's passive at ${pct(v)}.` },
  glue:      { role: 'Flex',    name: 'Glue',           team: true, v: 4,   info: v => `Team +${Math.round(v)} HP.` },
  adapt:     { role: 'Flex',    name: 'Adaptable',      v: .03,  info: v => `+${pct(v)} hit and +${pct(v)} damage.` },
};
// Recurring scaling (kept all run, grows between battles):
//  Mastery: every battle a player plays makes their role passive stronger.
//  Duos: two roles fighting together build stacks every battle they both play; stacks stay if the pair splits up.
const DUOS = [
  { id: 'call',  a: 'IGL',    b: 'Entry',   to: ['Entry'],         short: 'CP', name: 'Called Push',  per: .03,  cap: 8, info: v => `Entry +${pct(v)} damage.` },
  { id: 'trade', a: 'Entry',  b: 'Support', to: ['Entry'],         short: 'TK', name: 'Trade Kit',    per: 8,    cap: 8, info: v => `Entry +${Math.round(v)} HP.` },
  { id: 'fort',  a: 'Anchor', b: 'Support', to: ['Anchor'],        short: 'FT', name: 'Fortified',    per: 1,    cap: 8, info: v => `Anchor +${Math.round(v)} armor.` },
  { id: 'hunt',  a: 'Flank',  b: 'Roam',    to: ['Flank', 'Roam'], short: 'HP', name: 'Hunting Pair', per: .015, cap: 8, info: v => `Flank and Roam +${pct(v)} hit chance.` },
];
// Trinkets: team-wide and permanent. Every 3rd round you pick 1 of 3; later picks come from better tiers.
// Stat keys (battle): hit, mag, hp, armor, rpm, dmg, rp (role passive strength), heal (team heals per team kill), banner (dmg per win).
// Run keys (prep): income (¢ per round), mastery (extra per battle), duo (stacks added to every duo when picked).
const TRINKETS = [
  { id: 'comms',   tier: 1, short: 'COMMS',  name: 'Comms Headset', hit: .03,          desc: 'Team +3% hit chance.' },
  { id: 'spare',   tier: 1, short: 'AMMO',   name: 'Spare Mags',    mag: .5,           desc: 'Team +50% mag size.' },
  { id: 'pouch',   tier: 1, short: 'POUCH',  name: 'Med Pouch',     hp: 8,             desc: 'Team +8 HP.' },
  { id: 'range',   tier: 1, short: 'RANGE',  name: 'Range Time',    dmg: .05,          desc: 'Team +5% damage.' },
  { id: 'piggy',   tier: 1, short: 'PIGGY',  name: 'Piggy Bank',    income: 1,         desc: '+¢1 per round.' },
  { id: 'supply',  tier: 2, short: 'ARMOR',  name: 'Armor Supply',  armor: 4,          desc: 'Team +4 armor.' },
  { id: 'surgeon', tier: 2, short: 'MEDIC',  name: 'Field Surgeon', heal: 20,          desc: 'Each team kill heals everyone 20 HP.' },
  { id: 'drill',   tier: 2, short: 'DRILL',  name: 'Drill Sergeant', mastery: 1,       desc: '2 mastery per battle instead of 1.' },
  { id: 'chest',   tier: 2, short: 'CHEST',  name: 'War Chest',     income: 3,         desc: '+¢3 per round.' },
  { id: 'chem',    tier: 2, short: 'CHEM',   name: 'Team Chemistry', duo: 3,           desc: '+3 stacks to every duo.' },
  { id: 'invest',  tier: 2, short: 'INVEST', name: 'Org Investment', invest: 2,      desc: '+¢2 per round, +¢2 more each round (max ¢10).' },
  { id: 'banner',  tier: 3, short: 'BANNER', name: 'Team Banner',   banner: .02,       desc: 'Team +2% damage per win.' },
  { id: 'over',    tier: 3, short: 'OVERCLK', name: 'Overclock',    rpm: .12,          desc: 'Team +12% RPM.' },
  { id: 'crates',  tier: 3, short: 'CRATES', name: 'Kevlar Crates', hp: 20,            desc: 'Team +20 HP.' },
  { id: 'head',    tier: 3, short: 'HEADCO', name: 'Head Coach',    rp: .6,            desc: 'Role passives 60% stronger.' },
  { id: 'scopes',  tier: 3, short: 'SCOPES', name: 'Tac Scopes',    hit: .06,          desc: 'Team +6% hit chance.' },
  { id: 'cracked', tier: 4, short: 'CRACKED', name: 'Cracked',      dmg: .25,          desc: 'Team +25% damage.' },
  { id: 'jugg',    tier: 4, short: 'JUGG',   name: 'Juggernaut Kit', armor: 4, hp: 20, desc: 'Team +4 armor, +20 HP.' },
  { id: 'golden',  tier: 4, short: 'GOLDEN', name: 'Golden Hands',  rpm: .2, mag: .5,  desc: 'Team +20% RPM, +50% mag size.' },
  { id: 'dynasty', tier: 4, short: 'DYNASTY', name: 'Dynasty',      banner: .03, income: 3, desc: 'Team +3% damage per win. +¢3 per round.' },
  { id: 'legend',  tier: 4, short: 'LEGEND', name: 'Legend Status', rp: 1.2,           desc: 'Role passives 120% stronger.' },
];
const TRK_EVERY = 3;
const trkTier = round => Math.min(4, Math.floor(round / TRK_EVERY));
const trkSum = (ids, k) => ids.reduce((a, id) => a + (TRINKETS.find(t => t.id === id)?.[k] || 0), 0);
const TIER_COLOR = ['', 'var(--r-common)', 'var(--r-rare)', 'var(--r-epic)', 'var(--r-legendary)'];
const mastMul = m => 1 + MASTERY.per * Math.min(MASTERY.cap, m || 0);
// Each Flex on the team stands in for one missing duo role (in duo order), so Flex-heavy teams can still build duos.
const DUO_ROLES = [...new Set(DUOS.flatMap(d => [d.a, d.b]))];
function flexSubs(team) {
  const need = DUO_ROLES.filter(r => !team.some(p => p.role === r)), m = new Map();
  team.filter(p => p.role === 'Flex').forEach((p, i) => need[i] && m.set(p, need[i]));
  return m;
}
// Who gets this duo's bonus, or null when the team can't field both roles
function duoCast(d, team) {
  const subs = flexSubs(team), roleOf = p => subs.get(p) || p.role;
  if (![d.a, d.b].every(r => team.some(p => roleOf(p) === r))) return null;
  return team.filter(p => d.to.includes(roleOf(p)));
}
const ROLE_ZONE = { Entry: 'Entry', Anchor: 'Anchor', Flank: 'Flank', Roam: 'Roam' };
// Short versions for the popovers: passive name + effect, gun name + damage + RPM
const rpShort = (p, zone) => {
  const P = ROLE_PASSIVES[p.rp], z = ROLE_ZONE[P.role], half = z && zone && zone !== 'bench' && zone !== z;
  const v = P.v * (ROLE_MULT[p.rarity] || 1) * mastMul(p.mastery) * (half ? .5 : 1);
  return `<b>${P.name}</b> ${P.info(v)}${half ? ` <span class="warn">Half outside ${z}.</span>` : ''}`;
};
// Same icons as the battle cards: bullet = damage per bullet, cycle = RPM
const ICO = {
  dmg: '<svg viewBox="0 0 12 12"><path d="M3 10.5V5.5Q3 1.5 6 1q3 .5 3 4.5v5z"/></svg>',
  rpm: '<svg viewBox="0 0 12 12"><path d="M10.5 6A4.5 4.5 0 1 1 6 1.5M6 1.5h3.5M9.5 1.5v3"/></svg>',
  hp:  '<svg viewBox="0 0 12 12"><path d="M6 10.5 1.6 6.2A2.6 2.6 0 0 1 6 2.6a2.6 2.6 0 0 1 4.4 3.6z"/></svg>',
  arm: '<svg viewBox="0 0 12 12"><path d="M6 1 10.5 2.6V6c0 2.6-2 4.3-4.5 5C3.5 10.3 1.5 8.6 1.5 6V2.6z"/></svg>',
  mag: '<svg viewBox="0 0 12 12"><path d="M3.5 1h5v4l1 6h-5l-1-6z"/></svg>',
};
// In-game gun numbers, same formula as battle.html statsFor (before gear and items):

  return l1 >= 2 ? (l2 >= 1 ? 3 : 2) : 0; };

      us.sort((a, b) => (b.where === 'player') - (a.where === 'player')); // a player holding one keeps the merged op

/* ---------- Juice: counting numbers, flying cards, floating text ---------- */
const NUMS = {};
function tweenNumbers() {
  document.querySelectorAll('[data-num]').forEach(el => {
    const k = el.dataset.num, to = +el.textContent, from = NUMS[k];
    NUMS[k] = to;
    if (from === undefined || from === to) return;
    el.classList.add(to > from ? 'tick-up' : 'tick-down');
    const t0 = performance.now(), dur = 450;
    const step = now => {
      const f = Math.min(1, (now - t0) / dur), e = 1 - (1 - f) ** 3;
      el.textContent = Math.round(from + (to - from) * e);
      if (f < 1) requestAnimationFrame(step); else el.classList.remove('tick-up', 'tick-down');
    };
    el.textContent = from; requestAnimationFrame(step);
  });
}
function floatText(el, text, good) {
  if (!el) return;
  const r = el.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'floater' + (good ? ' good' : ''); f.textContent = text;
  f.style.left = `${r.left + r.width / 2}px`; f.style.top = `${r.top - 4}px`;
  document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
}
// A copy of the bought card flies from where it was to where it landed
function fly(fromRect, html, toEl) {
  if (!fromRect || !toEl) return;
  const to = toEl.getBoundingClientRect(), c = document.createElement('div');
  c.className = 'fly'; c.innerHTML = html;
  Object.assign(c.style, { left: `${fromRect.left}px`, top: `${fromRect.top}px`, width: `${fromRect.width}px`, height: `${fromRect.height}px` });
  document.body.appendChild(c);
  const dx = to.left + to.width / 2 - (fromRect.left + fromRect.width / 2), dy = to.top + to.height / 2 - (fromRect.top + fromRect.height / 2);
  const sc = Math.max(.3, Math.min(1, to.width / fromRect.width));
  c.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) scale(${sc})`, opacity: .3 }],
    { duration: 380, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = () => c.remove();
}

// Column-wrapped flex doesn't report its width, so size the synergy column count by hand.
function sizeRail() {
  const box = document.querySelector('.syns'); box.style.width = '';
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const rows = Math.max(1, Math.floor((box.clientHeight + .3 * rem) / (2.4 * rem)));
  const cols = Math.ceil(box.children.length / rows);
  box.style.width = `${cols * 2.4 + (cols - 1) * .25}rem`;
}

// Shrink each name until it fits its plate; at the 12px floor, condense it horizontally instead of cutting it.
function fitNames() {
  document.querySelectorAll('.nm').forEach(el => {
    el.style.fontSize = el.style.transform = el.style.whiteSpace = el.style.width = '';
    const box = el.parentElement, cs = getComputedStyle(box);
    const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
    const w = el.offsetWidth; if (!w || w <= avail) return;
    const base = parseFloat(getComputedStyle(el).fontSize), fs = Math.max(12, Math.floor(base * avail / w * 10) / 10);
    el.style.fontSize = fs + 'px';
    let w2 = el.offsetWidth;
    // Two-word names on shop cards go onto two lines rather than being squeezed hard
    if (w2 > avail * 1.2 && el.closest('.card') && el.textContent.trim().includes(' ')) {
      Object.assign(el.style, { whiteSpace: 'normal', width: avail + 'px', textAlign: 'center' }); w2 = el.scrollWidth;
    }
    if (w2 > avail) el.style.transform = `scaleX(${(avail / w2).toFixed(3)})`;
  });
}

}

/* ---------- Actions ---------- */
let toastT;
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 1800); }
function spend(n) { S.credits -= n; if (n) S.bumpCredits = true; }

function addOp(op, prefer) {
  const i = S.slots[prefer] === null ? prefer : S.slots.indexOf(null), full = i < 0;  // dropped on an empty slot: use that one
  if (full && !mergeLevel(op)) { toast('Operator slots full', true); return false; }
  if (full) S.slots.push({ op, lvl: 1 }); else S.slots[i] = { op, lvl: 1 };  // a full bench can still take a copy that merges
  const lv = mergeOps(op);
  if (full) S.slots.length = 6;
  if (lv) S.lvlup = op;
  const holder = S.players.find(q => q.op === op && (!lv || q.lvl === lv));
  S.flash = holder && lv ? 'p:' + holder.id : 'op:' + op;
  return { slot: lv ? -1 : i, merged: lv };
}

// opts.zone: drop a new player straight into a zone; opts.fromRect: where the fly animation starts
function buy(i, target, opts = {}) {
  const c = S.shop[i], cost = costOf(c);
  const cardEl = document.querySelector(`[data-buy="${i}"]`);
  const fromRect = opts.fromRect || cardEl?.getBoundingClientRect(), art = cardEl?.querySelector('.art')?.outerHTML ?? '';
  if (S.credits < cost) return toast('Not enough credits', true);
  if (c.kind === 'player') {
    const toZone = opts.zone && active().length < 5 ? opts.zone : 'bench';
    if (opts.zone && toZone === 'bench') toast('Team full. Sent to bench');
    if (toZone === 'bench' && bench().length >= 3) return toast('Bench full. Sell someone', true);
    const np = { ...c.p, id: c.p.id + Math.random().toString(36).slice(2, 6), zone: toZone, op: null, buffs: [], weapon: null, att: [], gear: [] };
    S.players.push(np); S.flash = 'p:' + np.id;
  } else if (c.kind === 'op') {
    const r = addOp(c.op, opts.slot); if (!r) return;
    if (!r.merged && target && target.zone !== 'bench') equip(target, r.slot);
  } else {
    if (!target || target.zone === 'bench') return toast('Drop it on a player on the team', true);
    // One gun per player: replacing a bought gun asks first
    const old = c.item.gun ? target.weapon?.name : null;
    if (old && !opts.ok) { S.sel = { type: 'confirm', i, id: target.id, old, fromRect }; return render(); }
    if (c.item.gun) { toast(target.att.length ? `${gunOf(target)} replaced · attachments removed` : `${gunOf(target)} replaced`); target.weapon = c.item; target.att = []; }
    else if (c.item.gear) {
      if (c.item.id === 'shred' && target.gear.some(x => x.id === 'shred')) return toast('Already has Shred Rounds', true);
      target.gear.push({ id: c.item.id, n: 0 });
    }
    else if (c.item.att) {
      if (!gunOf(target)) return toast('Give them an op or a gun first', true);
      target.att.push(c.item.id);
    }
    else target.buffs = [...(target.buffs || []), c.item];
    S.flash = 'p:' + target.id;
  }
  spend(cost); c.sold = true; S.sel = null;
  const lv = S.lvlup;
  render();
  const landed = document.querySelector('.flash, .lvlup');
  fly(fromRect, `<div class="card" style="width:100%;height:100%">${art}</div>`, landed);
  floatText(document.getElementById('credits'), `-¢${cost}`);
  if (lv) setTimeout(() => floatText(document.querySelector('.lvlup'), `${OPS[lv][0].toUpperCase()} LV ${topLevel(lv)}!`, true), 250);
}

function sellPlayer(p) {
  if (p.op) { const i = S.slots.indexOf(null); if (i >= 0) S.slots[i] = { op: p.op, lvl: p.lvl || 1 }; }
  const gain = COST[p.rarity] - 1;
  S.players = S.players.filter(x => x !== p); S.credits += gain; S.bumpCredits = true; S.sel = null; render();
  floatText(document.getElementById('credits'), `+¢${gain}`, true);
}
function sellOp(i) {
  const gain = COPIES[S.slots[i].lvl];
  S.credits += gain; S.bumpCredits = true; S.slots[i] = null; S.sel = null; render();
  floatText(document.getElementById('credits'), `+¢${gain}`, true);
}

function reroll() {
  const cost = 1;
  if (S.credits < cost) return toast('Not enough credits', true);
  spend(cost); S.freeRerollUsed = true; S.frozen = false; S.sel = null;
  rollShop(); render();
}
function rollShop() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const pickRare = (list, key = 'r') => {
    const odds = RARITY_ODDS(S.round); let roll = Math.random() * 100, k = 0;
    while (k < 3 && roll >= odds[k]) roll -= odds[k++];
    for (; k >= 0; k--) { const got = list.filter(x => (x[key] || 'common') === RARITIES[k]); if (got.length) return pick(got); } // none at that rarity: step down
    return pick(list);
  };
  const opKeys = Object.keys(OPS).filter(op => !unitsOf(op).some(u => u.lvl === 3)); // maxed ops stop showing up
  const misc = () => (r => r < .45 ? pickRare(ITEMS) : r < .65 ? pick(ATTACH) : pickRare(GEAR))(Math.random());
  // Top row: 3 players, a gun and one other item. Bottom row: 4 ops
  S.shop = [
    ...[0, 1, 2].map(() => ({ kind:'player', p: pickRare(POOL, 'rarity') })),
    { kind:'item', item: gunItem(pick(Object.keys(WEAPONS))) },
    { kind:'item', item: misc() },
    ...[0, 1, 2, 3].map(() => ({ kind:'op', op: pick(opKeys) })),
  ];
}

function equip(p, slotIdx) {
  const incoming = S.slots[slotIdx]; // may be empty: then this just unequips
  if (!p.weapon && p.att?.length && OP_GUN[incoming?.op] !== OP_GUN[p.op]) { p.att = []; toast('New gun. Attachments removed'); } // their gun came from the op
  S.slots[slotIdx] = p.op ? { op: p.op, lvl: p.lvl || 1 } : null;
  p.op = incoming?.op || null; p.lvl = incoming?.lvl || 1; S.flash = 'p:' + p.id;
}

function dragKind(el) {

function startDrag() {

}
function drop(d, t, rect) {
  const k = d.kind;
  if (k === 'player') {
    const p = S.players.find(x => x.id === d.el.dataset.player), q = teamTile(t);
    if (t.id === 'sellZone') return sellPlayer(p);
    if (q && q.zone === p.zone) { const a = S.players.indexOf(p), b = S.players.indexOf(q); [S.players[a], S.players[b]] = [q, p]; S.flash = 'p:' + p.id; return render(); } // reorder
    if (q) { [p.zone, q.zone] = [q.zone, p.zone]; if (p.zone === 'bench') p.buffs = []; if (q.zone === 'bench') q.buffs = []; S.flash = 'p:' + p.id; return render(); }
    if (t.dataset.slot !== undefined) { equip(p, +t.dataset.slot); return render(); }
    if (t.dataset.zone) {

      p.zone = t.dataset.zone; S.flash = 'p:' + p.id; return render();
    }
    if (t.dataset.bench) {
      if (p.zone === 'bench') { S.players.push(...S.players.splice(S.players.indexOf(p), 1)); return render(); } // to the end of the bench
      if (p.zone !== 'bench' && bench().length >= 3) { toast('Bench full', true); return render(); }
      p.zone = 'bench'; p.buffs = []; S.flash = 'p:' + p.id; return render();

    if (t.id === 'sellZone') return sellOp(i);

    const q = teamTile(t); if (q) equip(q, i);

}

document.addEventListener('click', e => {

}

      return `<button class="tcard dcard ${d.picked.includes(name) ? 'on' : ''}" style="--tc:var(--r-common)" data-draft="${esc(name)}">

        <span>${p.passives.length ? p.passives.join(' · ') : '&nbsp;'}</span></button>`; }).join('')}</div>

function toggleDraft(name) {

// Each pick goes to the lane of its role if that's free (those are placed first), otherwise the first free lane. No ops yet.
function finishDraft() {
  if (S.draft?.picked.length !== DRAFT_KEEP) return;
  const free = ZONES.map(z => z.id);
  const picks = S.draft.picked.map(n => POOL.find(x => x.name === n))
    .sort((a, b) => free.includes(b.role) - free.includes(a.role)); // players with their own lane go first
  for (const p of picks) {
    const zone = free.includes(p.role) ? p.role : free[0];
    free.splice(free.indexOf(zone), 1);
    S.players.push({ ...p, id: p.id + Math.random().toString(36).slice(2, 6), zone, op: null, buffs: [], weapon: null, att: [], gear: [] });
  }

}

  $('drop').innerHTML = `<div class="box"><h2>PICK A BUFF</h2><div class="sub">Tier ${ROMAN[o.tier]} · whole team · permanent</div>
    <div class="tcards">${o.ids.map(id => { const t = TRINKETS.find(x => x.id === id);
      return `<button class="tcard" style="--tc:${c}" data-trk="${id}"><span class="tb">${t.short}</span><b>${t.name}</b><span>${t.desc}</span></button>`; }).join('')}</div></div>`;
  $('drop').hidden = false;
}
function takeTrinket(id) {
  const t = TRINKETS.find(x => x.id === id);
  S.trinkets = [...(S.trinkets || []), id]; S.offer = null; $('drop').hidden = true;
  if (t.duo) DUOS.forEach(d => S.duos[d.id] = Math.min(d.cap, (S.duos[d.id] || 0) + t.duo));
  S.flash = null; render(); toast(`${t.name} added`);
}

/* ---------- Round loop: restore the run, then apply the battle that just finished ---------- */
// Lives: 10 per run. A loss costs 1 on days 1-2, 2 on days 3-4, 3 from day 5.
const LIVES = 10, lossCost = day => day <= 2 ? 1 : day <= 4 ? 2 : 3;
// Income grows with the day: ¢6 on day 1, +¢1 a day, up to ¢12 from day 7. A new run starts with day 1's income.
const incomeFor = day => Math.min(12, 5 + day);
// Interest: +¢1 per ¢10 held when the round ends (max +¢5). Streaks: 2 in a row +¢1, 3–4 +¢2, 5+ +¢3 (wins or losses).
const interestOn = c => Math.min(5, Math.floor(c / 10));
const streakPay = n => { n = Math.abs(n); return n >= 5 ? 3 : n >= 3 ? 2 : n >= 2 ? 1 : 0; };
function afterBattle(r) {
  const before = active();
  S.hp ??= Math.max(1, LIVES - 2 * S.losses);
  if (!r.win) S.hp = Math.max(0, S.hp - lossCost(S.round));
  S.round++; r.win ? S.wins++ : S.losses++;
  if (r.endless) S.endless = true; // past 10 wins: keep playing, nothing else changes
  if (S.hp <= 0 || (S.wins >= 10 && !S.endless) || r.end) {
    const text = S.wins >= 10 ? `RUN WON${S.endless ? ' · ENDLESS' : ''} · ${S.wins}-${S.losses}` : `RUN OVER · ${S.wins}-${S.losses}`;
    let delta = null;
    if (S.mode === 'ranked' && S.runId) {
      if (S.rankDelta != null) delta = S.rankDelta; // scored by the server at the fight that ended it (profile already saved)
      else SYNC.quitRanked(S.runId); // ended by hand (END RUN in Endless)
    }
    RUN_ENDED = true; localStorage.removeItem('battler.save');
    localStorage.setItem('battler.over', JSON.stringify({ text, delta }));
    location.reload(); return;
  }
  const tr = S.trinkets || [];
  const st = S.streak || 0; S.streak = r.win ? (st > 0 ? st + 1 : 1) : (st < 0 ? st - 1 : -1);
  const base = incomeFor(S.round) + trkSum(tr, 'income'), interest = interestOn(S.credits), streak = streakPay(S.streak);
  // Sponsorship (all owned, before this battle's growth), Prize Money (top killer holding it), Org Investment (grows each round)
  const sponsor = S.players.reduce((a, p) => a + p.gear.filter(g => g.id === 'spons').reduce((b, g) => b + Math.min(4, 1 + Math.floor(g.n / 3)), 0), 0);
  const top = Math.max(0, ...r.team.map(x => x.kills));
  const prize = top ? r.team.filter(x => x.kills === top).reduce((a, x) => a + (x.buffs || [x.buff]).filter(n => n === 'Prize Money').length, 0) * 4 : 0;
  let invest = 0; if (tr.includes('invest')) { S.investN = (S.investN || 0) + 1; invest = Math.min(10, 2 * S.investN); }
  const pay = base + interest + streak + sponsor + prize + invest;
  S.credits += pay; S.freeRerollUsed = false; S.sel = null;
  const played = [];
  r.team.forEach(x => {
    const p = S.players.find(q => q.id === x.pid); if (!p) return;
    played.push(p);
    p.mastery = Math.min(MASTERY.cap, (p.mastery || 0) + 1 + trkSum(tr, 'mastery'));
    p.gear.forEach(g => { if (g.id === 'cond') g.n++; if (g.id === 'vet') g.n += x.kills; if (g.id === 'iron' && x.alive) g.n++; if (g.id === 'spons') g.n++; });
  });
  DUOS.forEach(d => { if (duoCast(d, played)) S.duos[d.id] = Math.min(d.cap, (S.duos[d.id] || 0) + 1); });
  if (!S.frozen) rollShop(); S.frozen = false;
  S.pendingToast = `${r.win ? 'WON' : 'LOST'} · +¢${pay}${pay > base ? ` (${[interest && `${interest} interest`, streak && `${streak} streak`, sponsor && `${sponsor} sponsor`, prize && `${prize} prize`, invest && `${invest} invest`].filter(Boolean).join(', ')})` : ''} · mastery +${1 + trkSum(tr, 'mastery')}`;
  if (S.round % TRK_EVERY === 0) rollOffer();
}
// One-time move: runs used to live in sessionStorage
try { for (const k of ['battler.save', 'battler.run', 'battler.result']) { const v = sessionStorage.getItem(k); if (v && !localStorage.getItem(k)) localStorage.setItem(k, v); sessionStorage.removeItem(k); } } catch {}
// Left during a fight (or on its result screen)? Go back to it.
let toBattle = false;
try { toBattle = localStorage.getItem('battler.phase') === 'battle' && !localStorage.getItem('battler.result'); } catch {}
if (toBattle) { location.replace('battle.html?t=' + Date.now()); throw new Error('back to the fight'); } // stop here: nothing below should run or save
try {
  const sv = JSON.parse(localStorage.getItem('battler.save'));
  if (sv?.players) { Object.assign(S, sv); S.slots = S.slots.map(u => typeof u === 'string' ? { op: u, lvl: 1 } : u); delete S.stacks;
    S.players.forEach(p => { if (!Array.isArray(p.buffs)) p.buffs = p.buff ? [p.buff] : []; delete p.buff; });
    // saved shop items are copies: refresh their text from the current tables
    S.shop = (S.shop || []).map(c => { const f = c.item && !c.item.gun && [...ITEMS, ...ATTACH, ...GEAR].find(x => x.id === c.item.id); return f ? { ...c, item: f } : c; }); }
  const r = JSON.parse(localStorage.getItem('battler.result'));
  localStorage.removeItem('battler.result');
  if (r) { localStorage.removeItem('battler.phase'); localStorage.removeItem('battler.prog'); }
  if (r && sv && r.round === S.round) afterBattle(r);
} catch {}

render();
addEventListener('pagehide', saveRun);
addEventListener('visibilitychange', () => document.hidden && saveRun());
// No run yet: start the one picked in the menu, or go back to the menu (it shows the last run's result)
if (!S.mode) {
  let start = null; try { start = localStorage.getItem('battler.start'); localStorage.removeItem('battler.start'); } catch {}
  if (start === 'casual' || start === 'ranked') startRun(start);
  else { RUN_ENDED = true; location.replace('menu.html'); throw new Error('to the menu'); }
} else if (S.draft) showDraft();
else if (S.offer) showDrop();
if (S.mode === 'ranked' && !S.runId && S.round > 1) { toRankedLost(); S.pendingToast = "Old ranked run. It's casual now."; }
if (S.pendingToast) { toast(S.pendingToast); S.pendingToast = null; }
saveRun(); SYNC.backup(); // back up the run (with this fight's result applied) on the server
Promise.all(Object.keys(OPS).map(k => fetch(`ops/${k}.svg`).then(r => r.text())
  .then(t => SVG[k] = t.replace(/<switch>[\s\S]*?<\/foreignObject>/, '').replace('</switch>', ''))
  .catch(() => {}))).then(render);
</script>
</body>
