<!doctype html>
<html lang="en">
<head>
<script src="turn.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle Prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#080a0c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>addEventListener('pageshow', e => { if (e.persisted) location.reload(); }); // Back/Forward shows a frozen copy; load it fresh so the checks below run</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror app/globals.css (terminal green + amber accent) */
  :root {
    --bg: hsl(220 20% 4%);
    --card: hsl(220 18% 7%);
    --fg: hsl(140 60% 70%);
    --hi: hsl(140 30% 88%);
    --primary: hsl(140 70% 55%);
    --muted: hsl(140 18% 42%);
    --accent: hsl(36 90% 55%);
    --danger: hsl(0 70% 55%);
    --enemy: hsl(0 65% 68%);
    --border: hsl(140 30% 18%);
    --r-common: hsl(140 15% 58%);
    --r-rare: hsl(205 85% 62%);
    --r-epic: hsl(280 70% 70%);
    --r-legendary: hsl(36 90% 55%);
  }
  html { font-size: clamp(14px, min(var(--lh, 100dvh) / 26, var(--lw, 100vw) / 54), 21px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--fg); }
  body { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1rem; line-height: 1.2;
    -webkit-tap-highlight-color: transparent; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .crt { pointer-events: none; position: fixed; inset: 0; z-index: 90;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 4px),
                radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.45) 100%); }
  .op { display: block; }
  .op svg { width: 100%; height: 100%; display: block; }
  .op svg path:not([fill]) { fill: hsl(140 35% 13%); }
  .theirs .op svg path:not([fill]) { fill: hsl(0 35% 13%); }

  .app { position: relative; height: var(--lh, 100dvh); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: .3rem;
    padding: max(.5rem, var(--sa-top, env(safe-area-inset-top))) max(.8rem, var(--sa-right, env(safe-area-inset-right))) max(.5rem, var(--sa-bottom, env(safe-area-inset-bottom))) max(.8rem, var(--sa-left, env(safe-area-inset-left))); }

  /* ---------- HUD ---------- */
  .hud { display: flex; align-items: center; gap: .8rem; }
  .tm { display: flex; align-items: center; gap: .45rem; }
  .tm b { font-size: 1.3rem; line-height: 1; }
  .tm.a b, .tm.a .pips { color: var(--primary); } .tm.b b, .tm.b .pips { color: var(--enemy); }
  .who { font-size: .86rem; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
  .pips { display: flex; gap: .2rem; } .pips i { width: .5rem; height: .9rem; background: currentColor; border-radius: 1px; transition: opacity .3s; }
  .pips i.x { opacity: .18; }
  .rd { flex: 1; text-align: center; font-size: .86rem; font-weight: 700; letter-spacing: .2em; color: var(--hi); white-space: nowrap; }
  .rd.clutch { color: var(--accent); }
  .ctl { height: 2rem; padding: 0 .4rem; font-size: .86rem; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
  .ctl.on { color: var(--accent); }

  /* ---------- Site schematic: each team holds a site; fights happen where the routes meet ---------- */
  .arena { position: relative; min-height: 0; }
  .map { position: absolute; inset: 0; }
  .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lines .site { stroke-width: 1; vector-effect: non-scaling-stroke; }
  .lines .site.a { fill: hsl(140 70% 55% / .05); stroke: hsl(140 50% 35% / .6); }
  .lines .site.b { fill: hsl(0 70% 55% / .05); stroke: hsl(0 45% 40% / .6); }
  .lines .route { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 4 6; vector-effect: non-scaling-stroke; }
  .slbl { position: absolute; transform: translate(-50%, 0); font-size: .86rem; font-weight: 700; letter-spacing: .14em; white-space: nowrap; pointer-events: none; }
  .slbl.a { color: hsl(140 40% 40%); } .slbl.b { color: hsl(0 40% 50%); }

  .grp { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: row; align-items: center; gap: .25rem; }
  .grp.a { flex-direction: row-reverse; } /* zone tab on the outer side: yours left, theirs right */
  .grp .row { display: flex; gap: .75rem; padding-right: .55rem; } /* room for each card's magazine bar */
  .zl { font-size: .86rem; font-weight: 700; letter-spacing: .08em; white-space: nowrap; line-height: 1; writing-mode: vertical-rl; transform: rotate(180deg); }
  .grp.a .zl { color: var(--primary); } .grp.b .zl { color: var(--enemy); }
  .ghost { width: calc(var(--tw) * .8); height: calc(var(--tw) * .8 + 3.2rem); border: 1px dashed hsl(0 0% 45% / .5); border-radius: 2px; display: grid; place-items: center;
    font-size: .86rem; font-weight: 700; letter-spacing: .1em; color: var(--muted); }

  .tile { --rc: var(--r-common); --c: var(--primary); position: relative; width: var(--tw); display: flex; flex-direction: column; align-items: center; gap: .15rem;
    transition: transform .22s cubic-bezier(.3,1.6,.5,1), filter .25s, opacity .25s; }
  .tile.theirs { --c: var(--enemy); }
  .tile .em { position: relative; width: 100%; aspect-ratio: 5 / 4; padding: 8% 20% 12%; border-radius: 2px; background: color-mix(in srgb, var(--c) 14%, hsl(220 15% 11%));
    border: 1px solid color-mix(in srgb, var(--c) 30%, var(--border)); border-top: 3px solid var(--rc); transition: box-shadow .22s; }
  .tile .em .op { width: 100%; height: 100%; color: var(--c); }
  /* The gun, held low and pointing at the other team */
  .tile .gun { position: absolute; bottom: 2%; left: 50%; transform: translateX(-50%); height: auto; fill: hsl(220 10% 82%); z-index: 2; pointer-events: none;
    filter: invert(.86) drop-shadow(0 0 1px hsl(220 20% 5%)) drop-shadow(0 0 1px hsl(220 20% 5%)); } /* sprites are black: flip them light, then a dark outline */
  .tile svg.gun.drawn { filter: drop-shadow(0 0 1px hsl(220 20% 5%)) drop-shadow(0 0 1px hsl(220 20% 5%)); }
  .tile.theirs .gun { transform: translateX(-50%) scaleX(-1); }
  .tile.firing .gun { animation: recoil .12s ease-out; }
  .tile.reloading .gun { opacity: .35; rotate: 25deg; transition: rotate .15s, opacity .15s; }
  .tile.reloading .em::after { content: 'RELOAD'; position: absolute; left: 0; right: 0; bottom: 30%; text-align: center; font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: var(--accent); text-shadow: 0 0 .25rem #000; z-index: 3; }
  @keyframes recoil { 50% { translate: -3px 0; rotate: -4deg; } }
  .tile.theirs.firing .gun { animation-name: recoil-b; }
  @keyframes recoil-b { 50% { translate: 3px 0; rotate: -4deg; } }
  .flash-m { position: absolute; z-index: 6; width: .9rem; height: .9rem; transform: translate(-50%, -50%); pointer-events: none; border-radius: 50%;
    background: radial-gradient(circle, hsl(48 100% 85%) 0 25%, hsl(36 100% 55% / .8) 45%, transparent 70%); animation: mflash .09s ease-out forwards; }
  @keyframes mflash { from { scale: 1.3; } to { scale: .4; opacity: 0; } }
  /* HP bar with the live number in it */
  .hpb { position: relative; display: block; width: 100%; height: .95rem; background: hsl(220 15% 16%); border-radius: 1px; overflow: hidden; }
  .hpb i { display: block; height: 100%; width: 100%; background: color-mix(in srgb, var(--c) 60%, hsl(220 15% 16%)); transition: width .3s ease, background .3s; }
  .hpb b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .86rem; line-height: 1; font-weight: 700; color: var(--hi); text-shadow: 0 0 .25rem #000, 0 0 .1rem #000; }
  /* Base stats under the name: damage per bullet and RPM. Everything else is in the tap popup. */
  .stw { width: 100%; display: flex; justify-content: center; overflow: hidden; }
  .st { display: inline-flex; gap: .3rem; letter-spacing: -.02em; white-space: nowrap; font-size: .86rem; line-height: 1.1; color: var(--muted); transform-origin: center; }
  .st span { display: inline-flex; align-items: center; gap: .08rem; } .st b { color: var(--fg, var(--hi)); font-weight: 700; }
  .st svg { width: .6rem; height: .6rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2; }
  .tile.dead .hpb b, .tile.dead .st { opacity: .5; }
  .hpb i.low { background: var(--accent); }
  .dmg { position: absolute; z-index: 7; pointer-events: none; transform: translate(-50%, -50%); font-weight: 700; font-size: 1.15rem; color: var(--hi); white-space: nowrap;
    text-shadow: 0 0 .4rem #000, 0 0 .2rem #000; animation: dmgUp .8s ease-out forwards; }
  .dmg.hs { font-size: 1.35rem; color: var(--accent); letter-spacing: .06em; }
  .dmg.miss { font-size: .86rem; color: var(--muted); }
  .dmg.heal { color: var(--primary); }
  .dmg.burn { font-size: .86rem; color: hsl(22 95% 60%); }
  .arena.ot { box-shadow: inset 0 0 6rem hsl(36 90% 40% / .35); }
  @keyframes dmgUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 30% { transform: translate(-50%, -60%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -130%); } }
  .tile .nmw { width: calc(100% + .3rem); display: flex; justify-content: center; overflow: hidden; }
  .nm { display: inline-block; white-space: nowrap; font-weight: 700; font-size: .95rem; line-height: 1.1; color: var(--hi); transform-origin: center; }
  /* Magazine: thin vertical bar just outside the right edge of the square, drains with each burst and refills over the reload */
  .magb { position: absolute; right: -8px; top: 0; bottom: 0; width: 4px; background: hsl(220 15% 18%); border-radius: 1px; overflow: hidden; z-index: 2; }
  .magb i { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: hsl(220 10% 72%); transition: height .12s linear, background .2s; }
  .magb.low i { background: var(--accent); }
  .tile.dead .magb { visibility: hidden; }
  .ticks { position: absolute; top: .3rem; right: .3rem; display: flex; gap: .2rem; }
  .ticks i { width: .5rem; height: .5rem; background: var(--accent); transform: rotate(45deg); animation: tick .35s cubic-bezier(.3,1.8,.5,1); }
  @keyframes tick { from { transform: rotate(45deg) scale(3); opacity: 0; } }

  .tile.firing { z-index: 3; transform: scale(1.06); } .tile.firing .em { box-shadow: 0 0 0 1px var(--c), 0 0 1rem color-mix(in srgb, var(--c) 50%, transparent); }
  .tile.aim { z-index: 3; transform: scale(1.1); } .tile.aim .em { box-shadow: 0 0 0 2px var(--accent), 0 0 1.6rem hsl(36 90% 55% / .55); }
  .tile.marked .em::before { content: ""; position: absolute; inset: -.35rem; border: 2px solid var(--danger); border-radius: 2px; pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) top left / 30% 30% no-repeat, linear-gradient(#000 0 0) top right / 30% 30% no-repeat, linear-gradient(#000 0 0) bottom left / 30% 30% no-repeat, linear-gradient(#000 0 0) bottom right / 30% 30% no-repeat;
            mask: linear-gradient(#000 0 0) top left / 30% 30% no-repeat, linear-gradient(#000 0 0) top right / 30% 30% no-repeat, linear-gradient(#000 0 0) bottom left / 30% 30% no-repeat, linear-gradient(#000 0 0) bottom right / 30% 30% no-repeat;
    animation: lock .22s ease-out; }
  @keyframes lock { from { inset: -1.4rem; opacity: 0; } }
  .tile.flash .em { filter: brightness(2.6) saturate(0); }
  .tile.dead { filter: grayscale(1) brightness(.4); }
  .tile.dead .em::after { content: ""; position: absolute; inset: 0; background: linear-gradient(-45deg, transparent 47%, var(--danger) 47% 53%, transparent 53%); }
  .tile.solo .em { box-shadow: 0 0 0 2px var(--accent), 0 0 2rem hsl(36 90% 55% / .5); }
  .tile.buffed .em { animation: buffed .6s ease-out; }
  @keyframes buffed { 0% { box-shadow: 0 0 0 2px var(--c), 0 0 1.6rem color-mix(in srgb, var(--c) 60%, transparent); } 100% { box-shadow: none; } }
  .arena.clutch .tile:not(.dead):not(.solo):not(.aim) { opacity: .75; }

  .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 4; }
  .fx line { stroke-linecap: round; filter: drop-shadow(0 0 4px currentColor); }
  .fx line.miss { filter: none; opacity: .55; }
  .pt { position: absolute; z-index: 5; width: .4rem; height: .4rem; pointer-events: none; border-radius: 1px; }
  /* Gadget: icon in the emblem's top-left; greys out once used or destroyed */
  .gd { position: absolute; top: 4%; left: 4%; width: 28%; aspect-ratio: 1; z-index: 2; display: grid; place-items: center; border-radius: 2px;
    background: hsl(220 20% 6% / .75); transition: opacity .3s, filter .3s; }
  .gd img, .gd svg { width: 86%; height: 86%; object-fit: contain; }
  .gd svg { fill: none; stroke: hsl(0 0% 95%); stroke-width: 1.6; }
  .gd.spent { opacity: .3; filter: grayscale(1); }
  .gd.ping { animation: gping .5s ease-out; }
  @keyframes gping { 0% { transform: scale(1.8); box-shadow: 0 0 0 2px var(--accent); } 100% { transform: scale(1); } }
  .gcall { position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, -50%); display: flex; align-items: center; gap: .3rem; font-size: .86rem; font-weight: 700;
    letter-spacing: .06em; white-space: nowrap; padding: .12rem .45rem .12rem .2rem; border-radius: 2px; background: hsl(220 20% 8% / .92); color: var(--hi);
    border: 1px solid var(--accent); animation: callout 1s ease-out forwards; }
  .gcall.bad { border-color: var(--danger); color: var(--danger); }
  .gcall i { width: 1.15rem; height: 1.15rem; display: grid; place-items: center; } .gcall i img, .gcall i svg { width: 100%; height: 100%; object-fit: contain; }
  .gcall i svg { fill: none; stroke: currentColor; stroke-width: 1.6; }
  .tile.revealed .em { outline: 1px dashed var(--accent); outline-offset: 2px; }
  .tile.conc .em { animation: conc .5s ease-in-out 3; }
  @keyframes conc { 50% { transform: rotate(-4deg) translateX(-2px); } }
  .lines .site { transition: stroke-width .3s; }
  .lines .site.walled { stroke-width: 3; stroke-dasharray: none; }
  .smokecloud { position: absolute; z-index: 5; width: var(--sz); height: var(--sz); transform: translate(-50%, -50%); pointer-events: none; border-radius: 50%;
    background: radial-gradient(circle, hsl(220 10% 75% / .45), hsl(220 10% 60% / .25) 45%, transparent 70%); animation: smoke 3s ease-out forwards; }
  @keyframes smoke { 0% { opacity: 0; scale: .3; } 12% { opacity: 1; scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; scale: 1.15; } }
  .callout { position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, -50%); font-size: .86rem; font-weight: 700; letter-spacing: .08em; white-space: nowrap;
    padding: .15rem .45rem; border-radius: 2px; background: var(--accent); color: var(--bg); animation: callout 1s ease-out forwards; }
  @keyframes callout { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 25% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%); } }
  .floater { position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, -50%); font-weight: 700; font-size: 1.1rem; white-space: nowrap; animation: floatUp 1s ease-out forwards; }
  .floater.good { color: var(--primary); } .floater.bad { color: var(--enemy); }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -160%); } }

  .band { position: absolute; z-index: 8; left: -.8rem; right: -.8rem; top: 50%; translate: 0 -50%; padding: .8rem 0; pointer-events: none;
    display: grid; place-items: center; gap: .2rem; background: hsl(220 18% 6% / .96); border-block: 1px solid var(--accent); animation: band 1.3s ease-out forwards; }
  .band span { font-size: clamp(1.4rem, calc(var(--lh, 100vh) * 0.08), 3rem); font-weight: 700; letter-spacing: .3em; padding-left: .3em; color: var(--accent); white-space: nowrap; line-height: 1; }
  .band small { font-size: .86rem; letter-spacing: .2em; color: var(--muted); font-weight: 700; }
  .band.won { border-color: var(--primary); } .band.won span { color: var(--primary); }
  .band.lost { border-color: var(--danger); } .band.lost span { color: var(--danger); }
  @keyframes band { 0% { opacity: 0; transform: scaleY(0); } 14% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- Result + recap ---------- */
  .result { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: var(--bg); }
  .result .box { display: grid; gap: .9rem; justify-items: center; text-align: center; animation: pop .35s ease-out; }
  .result h1 { font-size: clamp(2rem, calc(var(--lh, 100vh) * 0.12), 4.4rem); line-height: 1; letter-spacing: .25em; padding-left: .25em; color: var(--primary); text-shadow: 0 0 2rem hsl(140 70% 55% / .35); }
  .result.loss h1 { color: var(--danger); text-shadow: 0 0 2rem hsl(0 70% 55% / .35); }
  .rec { display: flex; gap: 2.2rem; }
  .rec > span { display: grid; gap: .25rem; justify-items: center; }
  .rec small { font-size: .86rem; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
  .rec b { font-size: 1.3rem; color: var(--hi); }
  .lives { display: flex; gap: .25rem; padding-top: .2rem; } .lives i { width: .6rem; height: 1.1rem; background: var(--danger); border-radius: 1px; } .lives i.x { background: var(--border); }
  .lives i.now { animation: lifeOut 1.2s ease-out both; } .lives em { font-style: normal; font-weight: 700; color: var(--danger); margin-left: .3rem; line-height: 1.1rem; }
  @keyframes lifeOut { from { background: var(--danger); } }
  .kills { display: flex; gap: .5rem; }
  .kp { display: grid; justify-items: center; gap: .15rem; width: 4.2rem; }
  .kp .op { width: 2.2rem; height: 2.2rem; color: var(--primary); }
  .kp .nmw { width: 100%; display: flex; justify-content: center; overflow: hidden; } .kp .nm { font-size: .86rem; }
  .kp em { font-style: normal; font-size: .86rem; font-weight: 700; color: var(--muted); }
  .kp.mvp em { color: var(--accent); } .kp.mvp .op { filter: drop-shadow(0 0 .6rem hsl(36 90% 55% / .6)); }
  .kp.dead .op { opacity: .4; }
  .why { font-size: .9rem; color: var(--hi); max-width: 30rem; } .why b { color: var(--accent); }
  /* Scoreboard (STATS): replaces the record and kill row */
  .board { display: none; border-collapse: collapse; font-size: clamp(.86rem, calc(var(--lh, 100vh) * 0.037), 1.4rem); }
  .result.stats .board { display: table; } .result.stats .rec, .result.stats .kills { display: none; }
  .result.stats h1 { font-size: clamp(1.4rem, calc(var(--lh, 100vh) * 0.07), 2.4rem); }
  .board th { font-weight: 700; letter-spacing: .12em; color: var(--muted); padding: .6em 1em .2em; text-align: right; }
  .board th:first-child { text-align: left; color: var(--hi); }
  .board td { padding: .18em 1em; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  .board td.sbname { display: flex; align-items: center; gap: .5em; text-align: left; white-space: nowrap; }
  .board .itc { text-align: left; white-space: nowrap; } .board .itn { color: var(--muted); }
  .board td.sbname .op { width: 1.3em; height: 1.3em; color: var(--primary); }
  .board tr.dead td { opacity: .55; } .board tr.mvp td:nth-child(2) { color: var(--accent); font-weight: 700; }
  .result .acts { display: flex; gap: .5rem; }
  .result #newRunBtn.on { border-color: var(--accent); color: var(--accent); } /* END RUN waiting for the second tap */
  .btn { height: 2.4rem; padding: 0 1rem; border: 1px solid var(--border); border-radius: 2px; font-size: .86rem; font-weight: 700; letter-spacing: .14em; }
  .btn.go { background: var(--primary); border-color: var(--primary); color: var(--bg); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }

  .pop { position: fixed; z-index: 85; width: min(16rem, calc(var(--lw, 100vw) - 1rem)); background: hsl(220 18% 6%); border: 1px solid var(--accent); border-radius: 2px; padding: .5rem .65rem; display: grid; gap: .25rem; }
  .pop b { color: var(--hi); } .pop .ln { font-size: .86rem; color: var(--muted); } .pop .ln b { color: var(--fg); }
  .pop .ph { display: flex; align-items: baseline; gap: .5rem; } .pop .ph b { font-size: 1.05rem; } .pop .mut { color: var(--muted); font-size: .86rem; }
  .pop .pst { display: flex; flex-wrap: wrap; gap: .2rem .6rem; font-size: .86rem; color: var(--muted); }
  .pop .pst span { display: inline-flex; align-items: center; gap: .15rem; } .pop .pst b { color: var(--fg); font-weight: 600; }
  .pop .pst svg { width: .7rem; height: .7rem; fill: none; stroke: currentColor; stroke-width: 1.6; }
  body.paused .rd::after { content: ' · PAUSED'; color: var(--accent); }

  .rotate { display: none; position: fixed; inset: 0; place-items: center; color: var(--hi); letter-spacing: .25em; font-weight: 700; }

  };
  if (skipping) return settle();
  if (e.hs) pop(vt, 'HEADSHOT', 'hs');
  vt.classList.add('flash');
  await new Promise(r => setTimeout(r, big ? 180 : 80)); // hit-stop: a beat of stillness sells the impact
  settle(); burst(vt, mine); shake(big ? 9 : slow ? 6 : 4); sfx.kill(mine, big);
  if (e.tag) callout(kt || vt, e.tag, k ? k.side : v.side);
  vt.animate([{ transform: 'none' }, { transform: `translateY(${v.side === 'theirs' ? -10 : 10}px) rotate(${Math.random() > .5 ? 4 : -4}deg)` }, { transform: 'none' }], { duration: 320, easing: 'ease-out' });
  if (slow || big) await sleep(slow ? 350 : 450); // only the last kill and clutch kills hold the frame
}
function dot(e) {
  setHp(e.id, e.hp);
  if (skipping || e.kind === 'gas') return;                  // gas just drains the bars; fire gets a small number
  pop(tile(e.id), '-' + e.dmg, 'burn');
}
function overtime() {
  $('arena').classList.add('ot'); $('rd').classList.add('clutch'); $('rd').textContent = 'OVERTIME';
  if (!skipping) band('OVERTIME', 'DAMAGE RAMPS · GAS IN');
}
function heal(e) {
  setHp(e.to, e.hp);
  if (skipping || tile(e.to).classList.contains('dead')) return;
  pop(tile(e.to), '+' + e.amt, 'heal'); sfx.heal();
}
// A gadget going off: a callout with its icon over the user, then whatever it did
function gcall(el, op, text, side, bad) {
  if (skipping || !el) return;
  const c = spawn('gcall' + (bad ? ' bad' : ''), `<i>${gadgetIcon(op)}</i>${esc(text)}`, at(el, side === 'mine' ? -.62 : .62), 1000), w = c.offsetWidth / 2 + 4, aw = $('arena').clientWidth;
  c.style.left = Math.min(Math.max(parseFloat(c.style.left), w), aw - w) + 'px';
}
function spendIcons(ids) { (ids || []).forEach(id => tile(id)?.querySelector('.gd')?.classList.add('spent')); }
function pingIcon(id) { const g = tile(id)?.querySelector('.gd'); if (!g) return; g.classList.remove('ping'); void g.offsetWidth; g.classList.add('ping'); }
function gadget(e) {
  const u = U(e.id), t = tile(e.id), mine = u.side === 'mine';
  (e.hits || []).forEach(h => setHp(h.id, h.hp));
  if (e.marks && !e.block) e.marks.forEach(id => { const x = U(id); if (x.side !== u.side && x.rev) tile(id)?.classList.add('revealed'); });
  if (e.breach) { const r = document.querySelector(`.lines .site.${e.breach === 'mine' ? 'a' : 'b'}`); r?.classList.remove('walled'); }
  if (skipping) return spendIcons(e.spent);
  if (!e.quiet) { pingIcon(e.id); gcall(t, u.op, e.text, u.side); sfx.buff(); }
  (e.hits || []).forEach(h => { const tt = tile(h.id); tracer(t, tt, mine); pop(tt, '-' + h.dmg, ''); sfx.hit(false); });
  if (e.conc) e.marks.forEach(id => { const x = tile(id); x.classList.remove('conc'); void x.offsetWidth; x.classList.add('conc'); });
  if (e.marks && !e.block && !e.conc) e.marks.forEach(id => { const x = tile(id); if (x && U(id).side === u.side) return; x && x.querySelector('.em').animate([{ filter: 'brightness(2)' }, { filter: 'none' }], { duration: 400 }); });
  if (e.block) setTimeout(() => { if (skipping) return; pingIcon(e.block.id); gcall(tile(e.block.id), e.block.op, e.block.text, U(e.block.id).side, true); sfx.toggle && sfx.aim(); }, 380 / speed);
  if (e.breach) { const r = document.querySelector(`.lines .site.${e.breach === 'mine' ? 'a' : 'b'}`); r?.animate([{ strokeWidth: 8, stroke: 'var(--accent)' }, { strokeWidth: 1 }], { duration: 700 }); shake(6); sfx.kill(mine, false); }
  setTimeout(() => spendIcons(e.spent), 500 / speed);
}
// Setup: everyone's placed gadgets light up at once
async function setup(e) {
  if (skipping || !e.ids.length) return;
  e.ids.forEach(id => pingIcon(id)); sfx.plant();
  await sleep(450);
}
// Opening utility (frag, claymore)
async function util(e) {
  const ft = tile(e.from), tt = tile(e.to);
  setHp(e.to, e.hp);
  if (skipping) return spendIcons(e.spent);
  callout(ft, e.label, U(e.from).side); sfx.shot(U(e.from).side === 'mine');
  if (e.block) { setTimeout(() => { pingIcon(e.block.id); gcall(tile(e.block.id), e.block.op, e.block.text, U(e.block.id).side, true); spendIcons(e.spent); }, 300 / speed); return; }
  if (e.fx === 'smoke') { const c = spawn('smokecloud', '', at(ft), 3000 / speed); c.style.setProperty('--sz', ft.offsetWidth * 2.6 + 'px'); return; }
  tracer(ft, tt, U(e.from).side === 'mine');
  if (e.fx === 'flash') { tt.querySelector('.em').animate([{ filter: 'brightness(4) saturate(0)' }, { filter: 'none' }], { duration: 1500 / speed }); pop(tt, 'BLIND', 'miss'); return; }
  if (e.missed) { pop(tt, 'MISSED', 'miss'); return; }
  if (e.fx === 'breach') { pop(tt, 'EXPOSED', 'hs'); tt.classList.add('revealed'); return; }
  pop(tt, '-' + e.dmg, ''); sfx.hit(false);
}

const CROSS_SPOT = { Flank: 'Roam', Roam: 'Flank' };
// Routes each position walks from its own site to its spot (% of the map), following the schematic's lines
const PATHS = {
  mine: {
    Anchor:  [[5, 50], [16, 50]],
    Support: [[5, 50], [9, 62], [9, 83]],
    Entry:   [[5, 50], [28, 50], [65, 50]],
    Flank:   [[5, 50], [16, 31], [16, 17], [38, 17]],
    Roam:    [[5, 50], [16, 69], [16, 83], [38, 83]],
  },
};
PATHS.theirs = Object.fromEntries(Object.entries(PATHS.mine).map(([z, pts]) => [CROSS_SPOT[z] || z, pts.map(([x, y]) => [100 - x, y])]));
const SETUP_ORDER = { Anchor: 0, Support: 120, Flank: 220, Roam: 220, Entry: 320 };

// Players walk out of their own site to their positions, then plant
async function intro() {
  if (skipping) return;
  const m = $('map'), W = m.clientWidth, H = m.clientHeight;
  let longest = 0;
  document.querySelectorAll('.grp').forEach(g => {
    const side = g.dataset.side, z = g.dataset.zone, pts = PATHS[side][z];
    // Keyframe offsets by real on-screen distance so the walk speed is steady
    const seg = pts.slice(1).map((p, k) => Math.hypot((p[0] - pts[k][0]) * W / 100, (p[1] - pts[k][1]) * H / 100));
    const total = seg.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    const frames = pts.map((p, k) => { if (k) acc += seg[k - 1]; return { left: p[0] + '%', top: p[1] + '%', offset: acc / total, opacity: k ? 1 : 0 }; });
    frames[0].opacity = 0; if (frames[1]) frames[1].opacity = 1;
    const dur = 350 + total * 1.1, delay = SETUP_ORDER[z] * .7;
    longest = Math.max(longest, dur + delay);
    g.querySelector('.zl').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: delay + dur, fill: 'backwards' });
    const walk = g.animate(frames, { duration: dur, delay, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'backwards' });
    walk.onfinish = () => {
      if (skipping) return;
      g.animate([{ scale: 1.12 }, { scale: 1 }], { duration: 260, easing: 'cubic-bezier(.3,1.6,.5,1)' });
      if (g.querySelector('.tile')) sfx.plant();
    };
  });
  await sleep(longest + 250);
  document.querySelectorAll('.grp, .grp .zl').forEach(g => g.getAnimations().forEach(a => a.finish())); // never leave anyone mid-walk or invisible
}
async function boosts(notes) {
  // All boosts pop together in one beat (the opening was too long one by one)
  if (skipping || !notes.length) return;
  for (const e of notes) {
    const u = U(e.id), good = u.side === 'mine';
    if (e.team) SIM.units.filter(x => x.side === u.side).forEach(x => { const t = tile(x.id); t.classList.remove('buffed'); void t.offsetWidth; t.classList.add('buffed'); floater(t, e.val, good); });
    else {
      const t = tile(u.id); t.classList.remove('buffed'); void t.offsetWidth; t.classList.add('buffed');
      if (/OPEN$/.test(e.text)) callout(t, 'OPEN LANE', u.side);
      floater(t, e.val, good);
    }
  }
  sfx.buff();
  await sleep(800);
}

function reload(e, pace) {
  if (skipping) return setMag(e.id, 1, 0);
  const t = tile(e.id), ms = e.dur * pace / speed; t.classList.add('reloading');
  setMag(e.id, 0, 0); requestAnimationFrame(() => requestAnimationFrame(() => setMag(e.id, 1, ms))); // empty, then fills over the reload
  setTimeout(() => t.classList.remove('reloading'), ms);
}
async function play(id) {
  const live = () => id === runId, ev = SIM.ev, resume = RESUME;
  RESUME = 0; CUR = 0;
  if (resume) skipping = true;   // fast-forward to where they left
  else saveProg();
  if (!skipping) document.querySelectorAll('.grp').forEach(g => g.style.visibility = 'hidden');
  await band(`ROUND ${RUN.round}`, `VS ${esc(GHOST.name.toUpperCase())} ${GHOST.w}-${GHOST.l}`);
  document.querySelectorAll('.grp').forEach(g => g.style.visibility = '');
  if (!live()) return;
  await intro();
  if (!live()) return;
  await boosts(ev.filter(e => e.t === 'note'));
  let clutch = false, now = 0, fired = false;
  const PACE = 4.26; // real playback ms per sim ms: sized so the average round runs ~30s at 1x (bursts keep their real fire rate)
  for (let i = 0; i < ev.length; i++) {
    if (!live()) return;
    const e = ev[i];
    if (resume && i === resume && e.t !== 'result') skipping = false;
    CUR = i; if (e.t === 'kill' || e.t === 'result') saveProg();
    if (e.at != null && e.at > now) { await sleep((e.at - now) * PACE * (clutch ? 1.6 : 1)); now = e.at; }
    if (!live()) return;
    if (e.t === 'clutch' && !clutch) $('rd').textContent = `${U(e.id).name.toUpperCase()} LAST ALIVE`;
    // Before first contact, utility and gadgets get their own beat; once guns are out they play over the fight
    if (e.t === 'shot') fired = true;
    if (e.t === 'util') { util(e); if (!fired) await sleep(400); }
    if (e.t === 'setup') await setup(e);
    if (e.t === 'gadget') { gadget(e); if (!e.quiet && !fired) await sleep(e.block ? 500 : 400); }
    if (e.t === 'aim') aim(e);
    if (e.t === 'shot') shot(e);
    if (e.t === 'heal') heal(e);
    if (e.t === 'reload') reload(e, PACE * (clutch ? 1.6 : 1));
    if (e.t === 'dot') dot(e);
    if (e.t === 'ot') overtime();
    if (e.t === 'kill') {
      await kill(e, clutch, !ev.slice(i + 1).some(x => x.t === 'kill'));
      // Spotlight a clutch only once it's winnable: last player alive vs one or two
      const a = document.querySelectorAll('.tile.mine:not(.dead)').length, b = document.querySelectorAll('.tile.theirs:not(.dead)').length;
      if (!clutch && a && b && Math.min(a, b) === 1 && Math.max(a, b) <= 2) {
        clutch = true;
        const solo = document.querySelector(`.tile.${a === 1 ? 'mine' : 'theirs'}:not(.dead)`), u = U(solo.dataset.u), n = a === 1 ? b : a;
        solo.classList.add('solo');
        $('arena').classList.add('clutch'); $('rd').classList.add('clutch'); $('rd').textContent = `CLUTCH 1v${n}`;
        await band(`CLUTCH 1v${n}`, esc(u.name.toUpperCase()));
        if (!skipping) { sfx.beat(); heart = setInterval(sfx.beat, 950 / speed); }
      }
    }
    if (e.t === 'result') {
      clearInterval(heart); heart = null;
      if (!skipping) { e.win ? sfx.win() : sfx.loss(); await band(e.win ? 'ROUND WON' : 'ROUND LOST', '', e.win ? 'won' : 'lost'); }
      if (live()) showResult(e);
    }
  }
}

// Scoreboard: who did what this round, worked out from the event log
function scoreboard() {
  const st = Object.fromEntries(SIM.units.map(u => [u.id, { k: 0, dmg: 0, shots: 0, hits: 0, hs: 0, heal: 0 }]));
  for (const e of SIM.ev) {
    if (e.t === 'shot' && st[e.from]) { const x = st[e.from]; x.dmg += e.dmg; x.shots += e.b.length; x.hits += e.b.filter(Boolean).length; if (e.hs) x.hs++; }
    if (e.t === 'util' && e.dmg && st[e.from]) st[e.from].dmg += e.dmg;
    if (e.t === 'heal' && st[e.from]) st[e.from].heal += e.amt;
    if (e.t === 'kill' && e.killer && st[e.killer]) st[e.killer].k++;
  }
  const rows = side => SIM.units.filter(u => u.side === side).map(u => ({ u, ...st[u.id] })).sort((a, b) => b.k - a.k || b.dmg - a.dmg);
  const top = { mine: Math.max(0, ...rows('mine').map(x => x.k)), theirs: Math.max(0, ...rows('theirs').map(x => x.k)) };
  const item = u => {
    const n = u.buff?.name, it = ITEMS[n]; if (!it) return '–';
    const f = Math.round(u.fx), pl = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`, ue = SIM.ev.find(e => e.t === 'util' && e.from === u.id);
    const r = it.throw ? (!ue ? 'Not used' : ue.block ? 'Blocked' : ue.missed ? 'Missed' : it.boom ? `${ue.dmg} dmg` : it.site ? `+${f} dmg` : pl(f, 'enemy miss', 'enemy misses'))
      : it.hp ? `+${it.hp} HP`
      : it.burn ? `${f} burn dmg`
      : n === 'Prize Money' ? (top[u.side] && u.kills === top[u.side] ? '+¢4' : 'No bonus')
      : it.magMul ? pl(Math.max(0, Math.floor(u.spent / (u.mag / it.magMul)) - u.reloads), 'fewer reload')
      : it.rpmMul > 1 || it.adren ? '+' + pl(f, 'shot')
      : it.hit ? '+' + pl(f, 'hit')
      : it.armor || it.dr ? `${f} dmg blocked`
      : `+${f} dmg`;
    return `<span class="itn">${esc(n)}</span> ${r}`;
  };
  const mvp = rows('mine').concat(rows('theirs')).sort((a, b) => b.k - a.k || b.dmg - a.dmg)[0]?.u;
  const tr = x => `<tr class="${x.u.alive ? '' : 'dead'} ${x.u === mvp ? 'mvp' : ''}"><td class="sbname">${opIcon(x.u.op)}<span style="color:var(--r-${x.u.rarity})">${esc(x.u.name)}</span></td>
    <td>${x.k}</td><td>${x.dmg}</td><td>${x.shots ? Math.round(100 * x.hits / x.shots) + '%' : '–'}</td><td>${x.hs}</td><td>${x.heal || '–'}</td><td class="itc">${item(x.u)}</td></tr>`;
  const head = label => `<tr class="th"><th>${label}</th><th title="Kills">K</th><th title="Damage dealt">DMG</th><th title="Bullets that hit">ACC</th><th title="Headshot kills">HS</th><th title="Healing done">HEAL</th><th class="itc" title="What their one-time item did">ITEM</th></tr>`;
  return `<table class="board">${head('YOU')}${rows('mine').map(tr).join('')}${head(esc(GHOST.name.toUpperCase()))}${rows('theirs').map(tr).join('')}</table>`;
}
function showResult(e) {
  LAST = e;
  const champ = e.win && !RUN.endless && RUN.wins + 1 >= 10; // 10th win: offer Endless
  const w = RUN.wins + (e.win ? 1 : 0), r = $('result');
  const hp0 = RUN.hp ?? Math.max(1, LIVES - 2 * RUN.losses), hpAfter = e.win ? hp0 : Math.max(0, hp0 - lossCost(RUN.round));
  const mine = SIM.units.filter(u => u.side === 'mine'), best = Math.max(...mine.map(u => u.kills));
  r.className = 'result ' + (e.win ? 'win' : 'loss');
  r.innerHTML = `<div class="box"><h1>${e.win ? 'WON' : 'LOST'}</h1>
    <div class="rec"><span><small>WINS</small><b>${w}${RUN.endless ? ' ∞' : '/10'}</b></span>
      <span><small>LIVES</small><span class="lives">${Array.from({ length: LIVES }, (_, i) => `<i class="${i < hpAfter ? '' : i < hp0 ? 'x now' : 'x'}"></i>`).join('')}${e.win ? '' : `<em>-${lossCost(RUN.round)}</em>`}</span></span></div>
    <div class="kills">${mine.map(u => `<div class="kp ${best && u.kills === best ? 'mvp' : ''} ${u.alive ? '' : 'dead'}">${opIcon(u.op)}<span class="nmw"><span class="nm">${esc(u.name)}</span></span><em>${u.kills}K</em></div>`).join('')}</div>
    ${champ ? '<div class="why"><b>RUN WON!</b> Keep playing in Endless or start a new run.</div>' : ''}
    ${scoreboard()}
    <div class="acts"><button class="btn" id="replayBtn">REPLAY</button><button class="btn" id="statsBtn">STATS</button>${champ
      ? '<button class="btn" id="newRunBtn">NEW RUN</button><button class="btn go" id="endlessBtn">ENDLESS ▶</button>'
      : `${RUN.endless ? '<button class="btn" id="newRunBtn">END RUN</button>' : ''}<button class="btn go" id="contBtn">CONTINUE ▶</button>`}</div></div>`;
  r.hidden = false; $('band').hidden = true; fitNames();
}

function start() {
  setPaused(false); pausedBy = null; runId++; skipping = false; clearInterval(heart); heart = null;
  SIM = simulate();
  $('result').hidden = true; $('band').hidden = true; $('fx').innerHTML = '';
  $('arena').classList.remove('clutch', 'ot'); $('rd').classList.remove('clutch'); $('rd').textContent = `ROUND ${RUN.round}`;
  HP = {}; renderBoard(); score();
  setTimeout(() => play(runId), 200);
}

// Shrink each name until it fits; at the 12px floor, condense it instead of cutting it.
function fitNames() {
  document.querySelectorAll('.nm, .fit').forEach(n => {
    n.style.fontSize = ''; n.style.transform = '';
    const avail = n.parentElement.clientWidth - 2, w = n.offsetWidth; if (!w || w <= avail) return;
    const base = parseFloat(getComputedStyle(n).fontSize), fs = Math.max(12, Math.floor(base * avail / w * 10) / 10);
    n.style.fontSize = fs + 'px';
    const w2 = n.offsetWidth; if (w2 > avail) n.style.transform = `scaleX(${(avail / w2).toFixed(3)})`;
  });
}

function showPop(u, t) {
  const pop = $('pop'), r = t.getBoundingClientRect(), hp = Math.max(0, Math.round(HP[u.id] ?? u.maxHp));
  const st = (ico, v, title) => `<span title="${title}">${ICO[ico]}<b>${v}</b></span>`;
  const tags = [...(u.passives || []),
    ...Object.entries((u.gear || []).reduce((a, x) => (a[x.id] = (a[x.id] || 0) + 1, a), {})).map(([id, n]) => GEAR[id].name + (n > 1 ? ' ×' + n : '')),
    u.buff?.name].filter(Boolean);
  pop.innerHTML = `<div class="ph"><b style="color:var(--r-${u.rarity})">${esc(u.name)}</b><span class="mut">${esc(u.gun)}</span></div>
    <div class="pst">${st('hp', `${hp}/${u.maxHp}`, 'Health')}${st('arm', u.block, 'Armor')}${st('dmg', u.dmg, 'Damage per bullet')}${st('rpm', u.rpm, 'Rounds per minute')}${st('mag', u.mag, 'Magazine')}</div>
    ${u.rpx ? `<div class="ln"><b>${ROLE_PASSIVES[u.rpx.id].name}</b> ${ROLE_PASSIVES[u.rpx.id].info(u.rpx.v)}</div>` : ''}
    ${tags.length ? `<div class="ln">${tags.map(esc).join(' · ')}</div>` : ''}`;
  pop.hidden = false;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = `${Math.min(Math.max(r.left + r.width / 2 - w / 2, 6), innerWidth - w - 6)}px`;
  pop.style.top = `${r.top - h - 8 < 6 ? r.bottom + 8 : r.top - h - 8}px`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-u],#speedBtn,#pauseBtn,#sndBtn,#replayBtn,#statsBtn,#contBtn,#endlessBtn,#newRunBtn');
  if (t?.id === 'statsBtn') { const on = $('result').classList.toggle('stats'); t.classList.toggle('on', on); t.textContent = on ? 'BACK' : 'STATS'; return; }
  $('pop').hidden = true;
  // A player's card pauses the fight; closing it resumes, unless you paused with the button yourself
  if (t?.dataset.u) { if (!paused) { setPaused(true); pausedBy = 'card'; } return showPop(U(t.dataset.u), t); }
  if (t?.id === 'pauseBtn') { setPaused(!paused); pausedBy = paused ? 'button' : null; return; }
  if (pausedBy === 'card') { setPaused(false); pausedBy = null; }
  if (!t) return;
  if (t.id === 'sndBtn') { t.classList.toggle('on', sfx.toggle()); return; }
  if (t.id === 'speedBtn') { speed = speed === 1 ? 2 : 1; t.textContent = `▶▶ ${speed}×`; t.classList.toggle('on', speed > 1); return; }
  if (t.id === 'replayBtn') return start();
  if (t.id === 'newRunBtn' && t.textContent === 'END RUN') { t.textContent = 'TAP TO CONFIRM'; t.classList.add('on'); return; } // ending Endless takes two taps
  if (['contBtn', 'endlessBtn', 'newRunBtn'].includes(t.id)) {
    // Report back to prep: it applies income, mastery, duo stacks and scaling gear
    try { localStorage.setItem('battler.result', JSON.stringify({ round: RUN.round, win: !!LAST?.win, endless: t.id === 'endlessBtn', end: t.id === 'newRunBtn',
      team: SIM.units.filter(u => u.side === 'mine').map(u => ({ pid: u.pid, kills: u.kills, alive: u.alive, buff: u.buff?.name || null })) })); } catch {}
    try { localStorage.removeItem('battler.prog'); } catch {}
    location.replace('prep.html?t=' + Date.now());
  }
});
addEventListener('resize', () => SIM && layout());

Promise.all(Object.keys(OP_NAMES).map(k => fetch(`ops/${k}.svg`).then(r => r.text())
  .then(t => SVG[k] = t.replace(/<switch>[\s\S]*?<\/foreignObject>/, '').replace('</switch>', ''))
  .catch(() => {}))).then(start);
